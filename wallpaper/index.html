      pinO: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M16 3a1 1 0 0 1 .7 1.7L15 6.4v4.2l2.7 2.7a1 1 0 0 1-.7 1.7H13v6l-1 1-1-1v-6H7a1 1 0 0 1-.7-1.7L9 10.6V6.4L7.3 4.7A1 1 0 0 1 8 3h8Z"/></svg>',
      folder: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>',
      check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
      plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
      caret: '<svg class="f-caret" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      bolt: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6L13 3Z"/></svg>',
      clock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    }
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

    const state = {
      sessions: [], now: Date.now(), view: store.get('f2.view') || 'recent', filter: 'all', q: '',
      toggles: store.get('f2.toggles') || {}, expanded: new Set(), selId: null,
      kidsOpen: new Set(store.get('f.kids') || []), kids: new Map(), kidIds: new Set(), orphanKids: new Set(),
      hash: '', online: null, renderedAt: 0,
    }
    let pollTimer = 0
    let pollCtl = null
    let failures = 0

    const token = () => window.BRIDGE_TOKEN || ''
    const url = (path, extra) => BRIDGE + path + '?t=' + encodeURIComponent(token()) + (extra || '')
    // 桥接服务后于壁纸启动、或者第一次运行时，口令文件还没写好：重新读一次
    let tokenLoadedAt = 0
    function reloadToken() {
      if (Date.now() - tokenLoadedAt < 5000) return
      tokenLoadedAt = Date.now()
      const s = document.createElement('script')
      s.src = 'bridge-token.js?' + Date.now()
      s.onload = s.onerror = () => s.remove()
      document.head.appendChild(s)
    }

    async function api(path, body) {
      const res = await fetch(url(path), { method: 'POST', body })
      const j = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status))
      return j
    }

    // ---- 数据 ----

    async function poll() {
      pollTimer = 0
      if (isPaused || pollCtl) return
      if (document.body.classList.contains('hide-cards')) return schedule(5000)
      const ctl = new AbortController()
      pollCtl = ctl
      const t = setTimeout(() => ctl.abort(), 15000)
      let res = null
      let data = null
      try {
        res = await fetch(url('/finder/sessions', '&h=' + encodeURIComponent(state.hash)), { cache: 'no-store', signal: ctl.signal })
        if (res.status === 200) data = await res.json()
      } catch (err) { res = null }
      clearTimeout(t)
      if (pollCtl !== ctl) return
      pollCtl = null
      if (res && res.status === 403) reloadToken()
      const ok = !!res && (res.status === 200 || res.status === 204)
      failures = ok ? 0 : failures + 1
      if (state.online !== ok) { state.online = ok; renderFoot() }
      if (data && Array.isArray(data.sessions)) {
        state.hash = typeof data.h === 'string' ? data.h : ''
        state.now = typeof data.now === 'number' ? data.now : Date.now()
        state.sessions = data.sessions.filter(s => s && typeof s.id === 'string').map(normRow)
        render()
      } else if (Date.now() - state.renderedAt > 30000) {
        // 内容没变也隔一会儿重画一次：「几分钟前」要走字
        state.now = Date.now()
        render()
      }
      schedule(failures ? Math.min(10000, 1000 * 2 ** failures) : 3000)
    }
    function schedule(ms) {
      if (pollTimer || pollCtl || isPaused) return
      pollTimer = setTimeout(poll, ms)
    }
    function stop() {
      clearTimeout(pollTimer)
      pollTimer = 0
      if (pollCtl) { pollCtl.abort(); pollCtl = null }
      stopWheelPoll()
      stopSmooth()
      endHold()
      // 壁纸睡着了，别让搜索框还开着
      if (inputOpened) {
        inputOpened = false
        api('/input/close', '').catch(() => {})
      }
      stopInputPoll()
    }

    function normRow(s) {
      const str = v => (typeof v === 'string' ? v : '')
      const num = v => (typeof v === 'number' && isFinite(v) ? v : 0)
      return {
        id: s.id, parentId: str(s.parentId), cli: str(s.cliSessionId), title: str(s.title) || '（未命名对话）',
        previousTitles: Array.isArray(s.previousTitles) ? s.previousTitles.filter(x => typeof x === 'string') : [],
        cwd: str(s.cwd), projectRoot: str(s.projectRoot), projectName: str(s.projectName), scratch: s.scratch === true, branch: str(s.branch),
        lastActivityAt: num(s.lastActivityAt), archived: s.archived === true, error: str(s.error), summary: str(s.summary), needsAction: str(s.needsAction),
        status: STATUS_TEXT[s.status] !== undefined ? s.status : 'idle', background: num(s.background), turnRunning: s.turnRunning === true, pinned: s.pinned === true,
      }
    }

    // 时间窗口由后台判断：过期的等待 / 出错已经被判成空闲
    const isActive = s => ['running', 'waiting', 'error', 'review'].includes(s.status)
    const terms = () => state.q.toLowerCase().split(/\s+/).filter(Boolean)
    const projectKey = s => (s.scratch ? '~scratch' : (s.projectRoot || '?').toLowerCase())
    const projectLabel = s => (s.scratch ? '临时对话' : s.projectName)
    const hue = name => { let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) % 360; return h }
    const initial = name => ([...name.replace(/^[^\p{L}\p{N}]+/u, '')][0] || '?').toUpperCase()
    function matches(s, ts) {
      if (!ts.length) return true
      const hay = [s.title, ...s.previousTitles, projectLabel(s), s.branch, s.summary, s.needsAction, s.cwd].join('\n').toLowerCase()
      return ts.every(t => hay.includes(t))
    }
    function passFilter(s) {
      const f = state.filter
      if (f === 'archived') return s.archived
      if (s.archived) return false
      if (f === 'all') return true
      if (f === 'pinned') return s.pinned
      return s.status === f
    }

    // ---- 渲染 ----

    function rel(t) {
      const d = state.now - t
      if (d < 60e3) return '刚刚'
      if (d < 3600e3) return Math.floor(d / 60e3) + ' 分钟前'
      const dt = new Date(t)
      const today = new Date(state.now)
      today.setHours(0, 0, 0, 0)
      const hm = String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0')
      if (t >= today.getTime()) return hm
      if (t >= today.getTime() - DAY) return '昨天 ' + hm
      if (d < 6 * DAY) return '周' + '日一二三四五六'[dt.getDay()]
      return (dt.getMonth() + 1) + '月' + dt.getDate() + '日'
    }

    // 在原文上先算出所有命中区间，再分段转义输出，避免替换到自己生成的标签
    function hl(text, ts) {
      text = String(text)
      if (!ts.length) return esc(text)
      const lower = text.toLowerCase()
      const hit = new Array(text.length).fill(false)
      for (const t of ts) for (let i = lower.indexOf(t); i >= 0; i = lower.indexOf(t, i + 1)) hit.fill(true, i, i + t.length)
      let out = ''
      let i = 0
      while (i < text.length) {
        let j = i
        while (j < text.length && hit[j] === hit[i]) j++
        out += hit[i] ? '<mark>' + esc(text.slice(i, j)) + '</mark>' : esc(text.slice(i, j))
        i = j
      }
      return out
    }

    const projectTag = (s, ts) => `<span class="${s.scratch ? 'f-tag neutral' : 'f-tag'}" style="--h:${hue(s.projectName)}">${hl(projectLabel(s), ts)}</span>`

    function kidsBtn(s) {
      const kids = state.kids.get(s.id)
      if (!kids) return ''
      const dots = ['running', 'waiting', 'error'].filter(st => kids.some(k => k.status === st))
        .map(st => `<i style="background:${STATUS_COLOR[st]}" title="有子对话${STATUS_TEXT[st]}"></i>`).join('')
      return `<button class="f-kids${state.kidsOpen.has(s.id) ? ' open' : ''}" data-kids="${esc(s.id)}">${ICON.caret}子对话 ${kids.length}${dots}</button>`
    }

    // 状态标签。“运行中”再细分：这一轮正在进行，还是这一轮已结束、只剩后台任务在跑
    function badgeHtml(s) {
      if (!STATUS_TEXT[s.status] || s.status === 'archived') return ''
      let text = STATUS_TEXT[s.status]
      if (s.status === 'running' && s.background > 0) text = s.turnRunning ? '运行中 · 后台 ' + s.background : '后台任务 ' + s.background
      else if (s.background > 0) text += ' · 后台 ' + s.background
      return `<span class="f-badge b-${s.status}"${s.background > 0 ? ` title="还有 ${s.background} 个后台任务没结束"` : ''}>${text}</span>`
    }

    const actsHtml = (s, canHandle) => `<div class="f-acts">
        ${canHandle ? `<button class="ok" data-act="handled" title="已处理：不再提醒，直到这个对话有新动静">${ICON.check}</button>` : ''}
        <button data-act="pin" title="${s.pinned ? '取消置顶' : '置顶'}">${s.pinned ? ICON.pin : ICON.pinO}</button>
        <button data-act="reveal" title="在资源管理器中打开项目文件夹">${ICON.folder}</button>
      </div>`

    function kidRowHtml(s, ts, last) {
      const badge = badgeHtml(s)
      const br = s.branch ? `<span class="f-br">${hl(s.branch, ts)}</span>` : ''
      return `<div class="f-row kid s-${s.status}${last ? ' last' : ''}${s.id === state.selId ? ' sel' : ''}" data-id="${esc(s.id)}" data-cli="${esc(s.cli)}" title="${esc(s.cwd)}">
        <span class="f-dot"></span>
        <div class="f-rbody">
          <div class="f-l1"><span class="f-title">${hl(s.title, ts)}</span><span class="f-time">${rel(s.lastActivityAt)}</span></div>
          ${badge || br ? `<div class="f-l2">${badge}${br}</div>` : ''}
        </div>
        ${actsHtml(s, false)}
      </div>`
    }

    function rowHtml(s, ts, o) {
      const br = s.branch ? `<span class="f-br">${hl(s.branch, ts)}</span>` : ''
      // 搜索时平铺出来的子对话、以及没能收进父对话的子对话，都标出来
      const kidTag = state.kidIds.has(s.id) || state.orphanKids.has(s.id) ? '<span class="f-tag neutral">子对话</span>' : ''
      let extra = ''
      if (s.status === 'error' && s.error) extra = `<div class="f-ask err">${hl(s.error, ts)}</div>`
      else if (s.status === 'waiting' && s.needsAction) extra = `<div class="f-ask">${hl(s.needsAction, ts)}</div>`
      else if (s.summary) extra = `<div class="f-l3">${hl(s.summary, ts)}</div>`
      const kids = !ts.length && state.kidsOpen.has(s.id) ? state.kids.get(s.id) || [] : []
      const showProject = o.showProject !== false
      return `<div class="f-row s-${s.status}${s.id === state.selId ? ' sel' : ''}" data-id="${esc(s.id)}" data-cli="${esc(s.cli)}" title="${esc(s.cwd)}">
        <span class="f-dot"></span>
        <div class="f-rbody">
          <div class="f-l1">${s.pinned ? `<span class="f-pin">${ICON.pin}</span>` : ''}<span class="f-title">${hl(s.title, ts)}</span><span class="f-time">${rel(s.lastActivityAt)}</span></div>
          <div class="f-l2">${badgeHtml(s)}${kidTag}${showProject ? projectTag(s, ts) : ''}${br}</div>
          ${extra}
          ${ts.length ? '' : kidsBtn(s)}
        </div>
        ${actsHtml(s, ['waiting', 'error', 'review'].includes(s.status))}
      </div>` + kids.map((k, i) => kidRowHtml(k, ts, i === kids.length - 1)).join('')
    }

    function statsHtml(items) {
      const parts = []
      for (const st of ['running', 'waiting', 'error']) {
        const n = items.filter(s => s.status === st).length
        if (n) parts.push(`<span style="color:${STATUS_COLOR[st]}" title="${STATUS_TEXT[st]}"><i style="background:${STATUS_COLOR[st]}"></i>${n}</span>`)
      }
      return parts.length ? `<div class="f-hstats">${parts.join('')}</div>` : ''
    }

    function card(key, items, ts, o) {
      if (!items.length) return ''
      const collapsible = !!o.collapsible
      const closed = collapsible && !ts.length && (key in state.toggles ? state.toggles[key] : !!o.defaultClosed)
      const cut = !closed && o.limit && !ts.length && !state.expanded.has(key) && items.length > o.limit + 1
      const shown = cut ? items.slice(0, o.limit) : items
      const head = `<div class="f-chead${collapsible ? ' toggle' : ''}" data-sec="${esc(key)}">
          ${o.avatar}
          <div class="f-hmain"><span class="f-hname">${esc(o.name)}</span>${o.sub ? `<span class="f-hsub">${esc(o.sub)}</span>` : ''}<span class="f-hn">${items.length}</span></div>
          ${o.stats ? statsHtml(items) : ''}
          ${o.time ? `<span class="f-htime">${rel(items[0].lastActivityAt)}</span>` : ''}
          ${o.newId ? `<button class="f-add" data-new="${esc(o.newId)}" title="${esc(o.newTip)}">${ICON.plus}</button>` : ''}
          ${collapsible ? ICON.caret : ''}
        </div>`
      const rows = closed ? '' : shown.map(s => rowHtml(s, ts, o)).join('') +
        (cut ? `<button class="f-more" data-more="${esc(key)}">再显示 ${items.length - o.limit} 个</button>` : '')
      return `<section class="f-card${closed ? ' closed' : ''}${o.cls ? ' ' + o.cls : ''}">${head}${rows}</section>`
    }

    // 找出 Claude 发起的子对话，收到最顶层的父对话下面（孙级也平铺在那里）。
    // 只有和父对话同一个项目、归档状态也一样时才收进去；否则单独显示并标上“子对话”
    function buildKids() {
      const byId = new Map(state.sessions.map(s => [s.id, s]))
      const linked = s => {
        const p = s.parentId && byId.get(s.parentId)
        return p && p.archived === s.archived && projectKey(p) === projectKey(s) ? p : null
      }
      const rootOf = s => {
        const seen = new Set([s.id])
        let cur = s
        for (let p = linked(cur); p; p = linked(cur)) {
          if (seen.has(p.id)) return s
          seen.add(p.id)
          cur = p
        }
        return cur
      }
      state.kids = new Map()
      state.kidIds = new Set()
      state.orphanKids = new Set()
      for (const s of state.sessions) {
        if (!s.parentId) continue
        const root = rootOf(s)
        if (root === s) { state.orphanKids.add(s.id); continue }
        state.kidIds.add(s.id)
        if (!state.kids.has(root.id)) state.kids.set(root.id, [])
        state.kids.get(root.id).push(s)
      }
      for (const list of state.kids.values()) list.sort((a, b) => b.lastActivityAt - a.lastActivityAt)
    }

    function render() {
      state.renderedAt = Date.now()
      const ts = terms()
      buildKids()
      // 子对话优先级低：不单独列出、不计入统计；搜索时才平铺出来
      const base = state.sessions.filter(s => matches(s, ts) && (ts.length || !state.kidIds.has(s.id)))
      const list = base.filter(passFilter).sort((a, b) => b.lastActivityAt - a.lastActivityAt)
      renderChips(base)
      let html = ''
      const plain = state.filter === 'all'
      const order = { running: 0, waiting: 1, error: 2, review: 3 }
      const pinned = plain ? list.filter(s => s.pinned) : []
      const active = plain ? list.filter(s => !s.pinned && isActive(s)).sort((a, b) => order[a.status] - order[b.status] || b.lastActivityAt - a.lastActivityAt) : []
      const rest = plain ? list.filter(s => !s.pinned && !isActive(s)) : list
      html += card('pinned', pinned, ts, { name: '置顶', avatar: `<span class="f-av icon" style="color:var(--orange)">${ICON.pin}</span>` })
      html += card('active', active, ts, { name: '进行中', avatar: `<span class="f-av icon" style="color:var(--st-run)">${ICON.bolt}</span>`, stats: true, cls: 'f-active' })
      if (state.view === 'project') {
        const groups = new Map()
        for (const s of rest) {
          const k = projectKey(s)
          if (!groups.has(k)) groups.set(k, { sample: s, items: [] })
          groups.get(k).items.push(s)
        }
        for (const [k, g] of groups) {
          const s = g.sample
          const avatar = s.scratch ? '<span class="f-av neutral">临</span>' : `<span class="f-av" style="--h:${hue(s.projectName)}">${esc(initial(s.projectName))}</span>`
          html += card('p:' + k, g.items, ts, {
            name: projectLabel(s), sub: s.scratch ? '无文件夹' : '', avatar, stats: true, time: true,
            // 外部链接没法指定“无文件夹”（桌面端会沿用上次选的目录），所以临时对话不放“+”
            newId: s.scratch ? '' : s.id, newTip: '在 ' + s.projectName + ' 里开新对话',
            collapsible: true, defaultClosed: true, limit: 5, showProject: false,
          })
        }
      } else {
        const today = new Date(state.now)
        today.setHours(0, 0, 0, 0)
        const t0 = today.getTime()
        const buckets = [['今天', t => t >= t0], ['昨天', t => t >= t0 - DAY], ['最近 7 天', t => t >= t0 - 6 * DAY], ['最近 30 天', t => t >= t0 - 29 * DAY], ['更早', () => true]]
        const used = new Set()
        for (const [name, fn] of buckets) {
          const items = rest.filter(s => !used.has(s.id) && fn(s.lastActivityAt))
          items.forEach(s => used.add(s.id))
          html += card('t:' + name, items, ts, { name, avatar: `<span class="f-av icon">${ICON.clock}</span>`, stats: true, collapsible: true, defaultClosed: name !== '今天', limit: name === '今天' ? 0 : 8 })
        }
      }
      // 刷新时保持滚到的位置（容器本身不换，scrollTop 不会丢）
      $('fList').innerHTML = html || `<div class="f-empty">${ts.length ? '没有找到匹配的对话' : state.online === false ? '连不上桥接服务。它会在开机时自动启动；也可以手动运行 claude-wallpaper-bridge.exe。' : '这里还没有对话'}</div>`
      if (state.selId && !$('fList').querySelector('.f-row[data-id="' + CSS.escape(state.selId) + '"]')) state.selId = null
      renderFoot(list.length)
      updateThumb()
    }

    function renderChips(base) {
      const n = {
        all: base.filter(s => !s.archived).length,
        pinned: base.filter(s => s.pinned && !s.archived).length,
        archived: base.filter(s => s.archived).length,
      }
      for (const st of ['running', 'waiting', 'error', 'review']) n[st] = base.filter(s => s.status === st).length
      $('fChips').innerHTML = FILTERS.filter(([k]) => k === 'all' || k === state.filter || n[k] > 0)
        .map(([k, t]) => `<button class="f-chip${state.filter === k ? ' on' : ''}" data-f="${k}">${STATUS_COLOR[k] ? `<i style="background:${STATUS_COLOR[k]}"></i>` : ''}${t}<span class="n">${n[k]}</span></button>`).join('')
    }

    function renderFoot(shown) {
      if (shown === undefined) return
      const total = state.sessions.filter(s => !s.archived && !state.kidIds.has(s.id)).length
      setText('fCount', shown === total ? total + ' 个对话' : '显示 ' + shown + ' / ' + total + ' 个对话')
    }

    function toast(msg, action) {
      const t = $('fToast')
      t.innerHTML = esc(msg) + (action ? ' <button>' + esc(action.label) + '</button>' : '')
      t.classList.toggle('has-act', !!action)
      if (action) t.querySelector('button').onclick = () => { t.classList.remove('show'); action.fn() }
      t.classList.add('show')
      clearTimeout(toast.h)
      const hide = () => { toast.h = setTimeout(() => t.classList.remove('show'), action ? 8000 : 2200) }
      t.onmouseenter = () => clearTimeout(toast.h)
      t.onmouseleave = hide
      hide()
    }

    // ---- 交互 ----

    async function openSession(id, row) {
      const s = state.sessions.find(x => x.id === id)
      if (!s) return
      if (row) {
        row.classList.add('is-opening')
        setTimeout(() => row.classList.remove('is-opening'), 700)
      }
      try { await api('/finder/open', id); toast('已在 Claude 中打开「' + s.title + '」') } catch (err) { toast(err.message) }
    }
    function select(id, scroll) {
      state.selId = id
      $('fList').querySelectorAll('.f-row.sel').forEach(r => r.classList.remove('sel'))
      const row = id && $('fList').querySelector('.f-row[data-id="' + CSS.escape(id) + '"]')
      if (row) {
        row.classList.add('sel')
        if (scroll) row.scrollIntoView({ block: 'nearest' })
      }
    }

    $('fList').addEventListener('click', async ev => {
      noteActivity()
      // “+”：在这个项目里开新对话（先于卡片折叠处理，免得点“+”顺带把卡片折起来）
      const add = ev.target.closest('[data-new]')
      if (add) {
        try {
          const r = await api('/finder/new', add.dataset.new)
          toast('已在 Claude 中新建对话：' + String(r.folder || '').split(/[\\/]/).pop())
        } catch (err) { toast(err.message) }
        return
      }
      const head = ev.target.closest('.f-chead.toggle')
      if (head) {
        state.toggles[head.dataset.sec] = !head.parentElement.classList.contains('closed')
        store.set('f2.toggles', state.toggles)
        return render()
      }
      const more = ev.target.closest('[data-more]')
      if (more) { state.expanded.add(more.dataset.more); return render() }
      const kb = ev.target.closest('[data-kids]')
      if (kb) {
        const id = kb.dataset.kids
        state.kidsOpen.has(id) ? state.kidsOpen.delete(id) : state.kidsOpen.add(id)
        store.set('f.kids', [...state.kidsOpen])
        return render()
      }
      const row = ev.target.closest('.f-row')
      if (!row) return
      const id = row.dataset.id
      const s = state.sessions.find(x => x.id === id)
      if (!s) return
      const actBtn = ev.target.closest('[data-act]')
      const act = actBtn && actBtn.dataset.act
      if (act === 'pin') {
        s.pinned = !s.pinned
        render()
        api('/finder/pin', id + '\n' + (s.pinned ? 1 : 0)).catch(err => toast('置顶失败：' + err.message))
        return
      }
      if (act === 'handled') {
        const prev = s.status
        s.status = 'idle'
        render()
        const saved = api('/finder/handled', id + '\n1')
        saved.catch(err => { s.status = prev; render(); toast('标记失败：' + err.message) })
        toast('已标记为处理过，有新动静会再提醒', {
          label: '撤销',
          fn: () => {
            s.status = prev
            render()
            saved.then(() => api('/finder/handled', id + '\n0')).catch(err => toast('撤销失败：' + err.message))
          },
        })
        return
      }
      if (act === 'reveal') { api('/finder/reveal', id).catch(err => toast(err.message)); return }
      select(id)
      openSession(id, row)
    })

    $('fChips').addEventListener('click', ev => {
      const c = ev.target.closest('[data-f]')
      if (!c) return
      state.filter = c.dataset.f
      render()
      $('fList').scrollTop = 0
      updateThumb()
    })
    function setView(v) {
      state.view = v
      store.set('f2.view', v)
      $('fViews').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v))
    }
    $('fViews').addEventListener('click', ev => {
      const b = ev.target.closest('[data-v]')
      if (!b) return
      setView(b.dataset.v)
      render()
      $('fList').scrollTop = 0
      updateThumb()
    })
    setView(state.view === 'project' ? 'project' : 'recent')

    // ---- 搜索 ----

    function showQuery() {
      const q = $('fQ')
      q.textContent = state.q || '搜索标题、项目、分支、总结'
      q.classList.toggle('is-empty', !state.q)
      $('fClear').hidden = !state.q
    }
    function setQuery(text) {
      const next = String(text).trim()
      if (next === state.q) return
      state.q = next
      showQuery()
      render()
      $('fList').scrollTop = 0
      updateThumb()
    }

    let inputTimer = 0
    // 原生输入框是否（可能）开着：打开请求发出去就算，收到关闭才算关
    let inputOpened = false
    // 每次开始或停止都换一代：还在路上的旧请求回来时认不出自己，直接作废
    let inputGen = 0
    function stopInputPoll() {
      inputGen++
      clearTimeout(inputTimer)
      inputTimer = 0
      $('fSearch').classList.remove('is-typing')
    }
    async function pollInput(gen) {
      inputTimer = 0
      let d = null
      try {
        const res = await fetch(url('/input/state'), { cache: 'no-store' })
        if (res.ok) d = await res.json()
      } catch (err) {}
      if (gen !== inputGen) return
      if (!d || isPaused) return stopInputPoll()
      setQuery(typeof d.text === 'string' ? d.text : '')
      for (const key of Array.isArray(d.keys) ? d.keys : []) onKey(key)
      if (d.open) inputTimer = setTimeout(pollInput, 40, gen)
      else {
        inputOpened = false
        stopInputPoll()
      }
    }
    // 输入框里按方向键选对话，回车打开
    function onKey(key) {
      const rows = [...$('fList').querySelectorAll('.f-row')]
      if (key === 'Enter') {
        // 没选中时打开第一条，搜到了回车就能进
        const id = state.selId || (rows[0] && rows[0].dataset.id)
        const row = id && rows.find(r => r.dataset.id === id)
        if (id) { select(id, true); openSession(id, row) }
        return
      }
      if (!rows.length) return
      const ids = rows.map(r => r.dataset.id)
      let i = ids.indexOf(state.selId)
      i = key === 'Down' ? Math.min(ids.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1)
      select(ids[i], true)
    }
    $('fSearch').addEventListener('click', async ev => {
      noteActivity()
      if (ev.target.closest('#fClear')) {
        // 先作废轮询，不然还在路上的回复会把旧词写回来
        stopInputPoll()
        setQuery('')
        inputOpened = false
        api('/input/close', '').catch(() => {})
        return
      }
      // 原生输入框盖在这个位置；页面坐标乘上缩放比就是屏幕物理像素（壁纸铺满主屏，原点相同）
      const r = $('fSearch').getBoundingClientRect()
      const pad = 34
      const dpr = window.devicePixelRatio || 1
      const fontPx = parseFloat(getComputedStyle($('fQ')).fontSize) * dpr
      const rect = [r.left + pad, r.top + 2, r.width - pad - 34, r.height - 4].map(n => Math.round(n * dpr))
      stopInputPoll()
      const gen = inputGen
      inputOpened = true
      try {
        await api('/input/open', rect.join(' ') + ' ' + Math.round(fontPx) + '\n' + state.q)
        // 打开的路上壁纸被暂停了：刚弹出来的马上收回去
        if (gen !== inputGen || isPaused) {
          if (isPaused) {
            inputOpened = false
            api('/input/close', '').catch(() => {})
          }
          return
        }
        $('fSearch').classList.add('is-typing')
        inputTimer = setTimeout(pollInput, 60, gen)
      } catch (err) {
        inputOpened = false
        toast('搜索框打不开：' + err.message)
      }
    })
    showQuery()

    // ---- 滚动 ----

    const list = $('fList')
    function updateThumb() {
      const track = $('fTrack')
      const canScroll = list.scrollHeight > list.clientHeight + 2
      track.hidden = !canScroll
      $('fUp').disabled = !canScroll || list.scrollTop <= 1
      $('fDown').disabled = !canScroll || list.scrollTop + list.clientHeight >= list.scrollHeight - 1
      if (!canScroll) return
      const h = track.clientHeight
      const thumbH = Math.max(30, h * list.clientHeight / list.scrollHeight)
      const top = (h - thumbH) * list.scrollTop / (list.scrollHeight - list.clientHeight)
      const thumb = $('fThumb')
      thumb.style.height = thumbH + 'px'
      thumb.style.transform = 'translateY(' + top + 'px)'
    }
    list.addEventListener('scroll', updateThumb, { passive: true })
    if (window.ResizeObserver) new ResizeObserver(updateThumb).observe(list)
    // 平滑滚动：有一个目标位置，每帧追上剩下距离的一部分。帧率由 Wallpaper Engine 的设置决定
    let smoothTo = null
    let smoothFrame = 0
    function stopSmooth() {
      cancelAnimationFrame(smoothFrame)
      smoothFrame = 0
      smoothTo = null
    }
    function smoothStep() {
      smoothFrame = 0
      if (smoothTo === null) return
      const left = smoothTo - list.scrollTop
      if (Math.abs(left) < 1) {
        list.scrollTop = smoothTo
        smoothTo = null
      } else {
        list.scrollTop += left * 0.38
        // 已经顶到头了就别再追
        if (Math.abs(smoothTo - list.scrollTop) >= Math.abs(left)) smoothTo = null
        else smoothFrame = requestAnimationFrame(smoothStep)
      }
      updateThumb()
    }
    const scrollBy = dy => {
      const max = list.scrollHeight - list.clientHeight
      const from = smoothTo === null ? list.scrollTop : smoothTo
      smoothTo = Math.max(0, Math.min(max, from + dy))
      if (!smoothFrame) smoothFrame = requestAnimationFrame(smoothStep)
    }
    const page = dir => scrollBy(dir * list.clientHeight * 0.8)

    // 上下按钮：点一下翻一页，按住连续翻
    let holdTimer = 0
    const endHold = () => { clearInterval(holdTimer); clearTimeout(holdTimer); holdTimer = 0 }
    for (const [id, dir] of [['fUp', -1], ['fDown', 1]]) {
      $(id).addEventListener('mousedown', ev => {
        ev.preventDefault()
        noteActivity()
        page(dir)
        endHold()
        holdTimer = setTimeout(() => { holdTimer = setInterval(() => scrollBy(dir * 90), 80) }, 350)
      })
    }
    document.addEventListener('mouseup', endHold)

    // 拖滚动条；点轨道的空白处翻一页
    let thumbDrag = null
    $('fThumb').addEventListener('mousedown', ev => {
      ev.preventDefault()
      ev.stopPropagation()
      stopSmooth()
      thumbDrag = { y: ev.clientY, top: list.scrollTop }
      $('fThumb').classList.add('is-drag')
    })
    document.addEventListener('mousemove', ev => {
      if (!thumbDrag) return
      const track = $('fTrack').clientHeight
      const room = track - $('fThumb').offsetHeight
      if (room > 0) list.scrollTop = thumbDrag.top + (ev.clientY - thumbDrag.y) * (list.scrollHeight - list.clientHeight) / room
      updateThumb()
    })
    document.addEventListener('mouseup', () => {
      thumbDrag = null
      $('fThumb').classList.remove('is-drag')
    })
    $('fTrack').addEventListener('mousedown', ev => {
      if (ev.target !== $('fTrack')) return
      ev.preventDefault()
      const r = $('fThumb').getBoundingClientRect()
      page(ev.clientY < r.top ? -1 : 1)
    })

    // 滚轮：Wallpaper Engine 转发了就直接用；一格大约两行
    let nativeWheel = false
    const wheelStep = d => Math.sign(d) * Math.min(Math.abs(d) * 0.8, list.clientHeight * 0.6)
    $('finder').addEventListener('wheel', ev => {
      nativeWheel = true
      stopWheelPoll()
      ev.preventDefault()
      const d = ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaMode === 2 ? ev.deltaY * list.clientHeight : ev.deltaY
      scrollBy(wheelStep(d))
    }, { passive: false })

    // 没收到过转发的滚轮：鼠标停在面板上时，问桥接服务这段时间滚了多少（它只在被问的时候才监听滚轮）
    let wheelTimer = 0
    let hovering = false
    let wheelBusy = false
    let wheelActiveAt = 0
    function stopWheelPoll() {
      clearTimeout(wheelTimer)
      wheelTimer = 0
    }
    async function pollWheel() {
      wheelTimer = 0
      if (wheelBusy || !hovering || nativeWheel || isPaused) return
      wheelBusy = true
      let d = null
      try {
        const res = await fetch(url('/input/wheel'), { cache: 'no-store' })
        if (res.ok) d = await res.json()
      } catch (err) {}
      wheelBusy = false
      if (nativeWheel || isPaused) return
      if (d && typeof d.d === 'number' && d.d !== 0) {
        wheelActiveAt = Date.now()
        scrollBy(wheelStep(-d.d))
      }
      if (!hovering) return
      clearTimeout(wheelTimer)
      // 刚滚过就问得勤一点，闲着时慢慢问（只是告诉桥接服务继续听着）
      wheelTimer = setTimeout(pollWheel, !d ? 2000 : Date.now() - wheelActiveAt < 1500 ? 30 : 200)
    }
    $('finder').addEventListener('mouseenter', () => {
      hovering = true
      if (!wheelTimer && !wheelBusy && !nativeWheel) pollWheel()
    })
    $('finder').addEventListener('mouseleave', () => { hovering = false })

    return {
      start() { schedule(300) },
      stop,
      resume() {
        schedule(300)
        if (hovering && !nativeWheel && !wheelTimer && !wheelBusy) pollWheel()
      },
      // 小 Claude 要跑过去提醒的那一行；这个会话不在列表里（或被折叠了）就指向整个面板
      rowOf(cliId) {
        return $('fList').querySelector('.f-row[data-cli="' + CSS.escape(cliId) + '"]') || $('finder')
      },
      updateThumb,
    }
  })()

  // ---- 右栏高度：拖顶部的手柄，位置按屏幕比例记住；双击恢复 ----
  ;(() => {
    const grip = $('sideGrip')
    const MIN = 0.02
    const MAX = 0.7
    const apply = ratio => {
      if (ratio === null) document.documentElement.style.removeProperty('--side-top')
      else document.documentElement.style.setProperty('--side-top', (ratio * 100).toFixed(2) + 'vh')
      Finder.updateThumb()
    }
    const saved = store.get('side-top')
    if (typeof saved === 'number' && saved >= MIN && saved <= MAX) apply(saved)
    let dragging = false
    let current = null
    grip.addEventListener('mousedown', ev => {
      ev.preventDefault()
      ev.stopPropagation()
      noteActivity()
      dragging = true
      grip.classList.add('is-drag')
    })
    document.addEventListener('mousemove', ev => {
      if (!dragging) return
      current = Math.max(MIN, Math.min(MAX, (ev.clientY + 8) / (window.innerHeight || 1)))
      apply(current)
    })
    document.addEventListener('mouseup', () => {
      if (!dragging) return
      dragging = false
      grip.classList.remove('is-drag')
      if (current !== null) store.set('side-top', current)
    })
    grip.addEventListener('dblclick', () => {
      current = null
      store.set('side-top', null)
      apply(null)
    })
  })()

  // ---- 暂停：Wallpaper Engine 暂停或页面看不见时，停掉轮询、溜达、3D 渲染和动画 ----

  function updatePaused() {
    const next = isWePaused || document.hidden
    if (next === isPaused) return
    isPaused = next
    document.body.classList.toggle('paused', isPaused)
    Pet3D.pause(isPaused)
    Cat3D.pause(isPaused)
    Cat3D2.pause(isPaused)
    if (isPaused) {
      cancelActs()
      Sky.stop()
      clearTimeout(duoTimer)
      clearTimeout(pairTimer)
      finishBallDrag(true)
      kitties.forEach(K => {
        K.stop()
        K.finishDrag()
        K.halt()
      })
      cancelPoll()
      clearTimeout(clockTimer)
      clearTimeout(elapsedTimer)
      clearTimeout(walkTimer)
      clearTimeout(lyric.timer)
      stopClock()
      cancelMusic()
      stopSys()
      Finder.stop()
      Stage.pause(true)
      finishDrag()
      stopWalk()
      progKey = ''
      showProgress()
      safeRender()
    } else {
      tickClock()
      safeRender()
      poll()
      scheduleWander()
      refreshMusic(1000)
      scheduleSys(500)
      Finder.resume()
      Stage.pause(false)
      progKey = ''
      tickLyric()
      syncTrack()
      kitties.forEach((K, i) => K.schedule(3000 + i * 2000))
      scheduleDuo()
      schedulePair()
      Sky.apply()
      // 回家睡觉的路上被暂停了：接着回家
      if (isAsleep && !insideHome) goHomeToSleep()
    }
  }
  document.addEventListener('visibilitychange', updatePaused)

  let resizeTimer = 0
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer)
    resizeTimer = setTimeout(() => {
      stopWalk()
      place(pos, 0)
      cardsKey = ''
      safeRender()
    }, 200)
  })

  // ---- Wallpaper Engine 设置 ----

  window.wallpaperPropertyListener = {
    applyUserProperties(p) {
      const body = document.body
      if (p.showcards) body.classList.toggle('hide-cards', !p.showcards.value)
      if (p.showquota) body.classList.toggle('hide-quota', !p.showquota.value)
      if (p.showclock) body.classList.toggle('hide-clock', !p.showclock.value)
      if (p.clockpos) {
        body.classList.toggle('clock-center', p.clockpos.value !== 'side')
        // 右侧一列高度变了：会话列表重新算放得下几行
        cardsKey = ''
        setTimeout(safeRender, 50)
      }
      // 旧的 showmusic / showlyric 开关不再读：它们关的是原来的小播放器，用户存过的值不该把新舞台也关掉
      if (p.showstage) {
        body.classList.toggle('hide-music', !p.showstage.value)
        Stage.want(!!music.title)
      }
      if (p.stagemode && typeof p.stagemode.value === 'string') Stage.setMode(p.stagemode.value)
      if (p.stagesize) document.documentElement.style.setProperty('--stage-scale', String(p.stagesize.value / 100))
      if (p.mirror) body.classList.toggle('mirror', !!p.mirror.value)
      if (p.petscale) {
        document.documentElement.style.setProperty('--scale', String(p.petscale.value / 100))
        setTimeout(fitDesk, 300)
      }
      if (p.roam) {
        opts.roam = !!p.roam.value
        if (!opts.roam) {
          halt()
          cancelVisit()
        }
        scheduleWander()
      }
      if (p.dj) opts.dj = !!p.dj.value
      if (p.showsys) {
        showSys = !!p.showsys.value
        document.body.classList.toggle('hide-sys', !showSys)
        if (showSys) scheduleSys(200)
        else stopSys()
      }
      if (p.showhome) {
        opts.home = !!p.showhome.value
        applyHome()
      }
      // 「猫猫」是旧的默认值，Wallpaper Engine 可能还记着它，当作没改过
      if (p.catname && typeof p.catname.value === 'string') {
        const name = p.catname.value.trim().slice(0, 12)
        K1.name = name && name !== '猫猫' ? name : '煤球'
      }
      if (p.catname2 && typeof p.catname2.value === 'string') {
        K2.name = p.catname2.value.trim().slice(0, 12) || '棉花'
      }
      if (p.dance) {
        opts.dance = !!p.dance.value
        updateDance()
      }
      cardsKey = ''
      setTimeout(() => {
        Pet3D.resize()
        place(pos, 0)
        safeRender()
      }, 50)
    },
    setPaused(value) {
      isWePaused = !!value
      updatePaused()
    },
  }

  // ---- 启动 ----

  tickClock()
  place(loadPos(), 0)
  Sky.apply()
  scheduleSys(800)
  Finder.start()
  setTimeout(() => {
    fitDesk()
    placeHomeActors()
    applyHome()
  }, 400)
  // 上班时每 6 秒「翻一页」：换一屏内容，偶尔换个软件（只重画一帧小岛）
  let screenTick = 0
  setInterval(() => {
    if (isPaused || !atDesk || !BUSY.has(mainPhase) || !homeOn()) return
    screenTick++
    if (screenTick % 5 === 0) screenPick++
    Home.set({ tick: screenTick, screen: screenOf(mainSession()) })
  }, 6000)
  if (isDemo) {
    // 演示模式下方便调试（演示模式不会真的发媒体键）
    window.__buddy = { visit, pressNext, walkTo, center, randomSpot, wander, cancelVisit, fx, Pet3D, Cat3D, Home, duoPet, duoChase, duoBall, duoRub, K1, K2, kitties, held, startPair, goHomeNap, endNap, duoLaser, pairChase, pairBoop, pairGroom, pairCuddle, ballPage, fitDesk, goToDesk, goHomeToSleep, enterHome, exitHome, Sky, setAtDesk, leaveDesk, place, clawdFeetTo }
    const s = document.createElement('script')
    s.src = 'demo.js'
    s.onload = () => {
      sessions = (window.DEMO_SESSIONS || []).map(normSession).filter(Boolean)
      isOnline = true
      if (window.DEMO_MUSIC) {
        Object.assign(music, window.DEMO_MUSIC)
        mediaSeen = true
        renderMusic()
      }
      safeRender()
    }
    document.head.appendChild(s)
  } else {
    safeRender()
    poll()
  }
  scheduleWander(3000)
  // 打开时本来就看不见：直接进入暂停
  updatePaused()
})()
</script>
</body>
</html>
