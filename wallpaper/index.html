      const minY = -b.y - b.h * 0.25
      const maxY = field.clientHeight - b.y - b.h * 0.8
      return { x: Math.round(Math.min(maxX, Math.max(minX, x))), y: Math.round(Math.min(maxY, Math.max(minY, y))) }
    }
    function kPlace(p, ms) {
      K.pos = kClamp(p.x, p.y)
      root.style.transition = ms ? 'transform ' + ms + 'ms linear' : 'none'
      root.style.transform = 'translate(' + K.pos.x + 'px,' + K.pos.y + 'px)'
      rect = null
    }
    K.place = kPlace
    function feet() {
      const c = canvas.getBoundingClientRect()
      return { x: c.left + c.width * 0.5, y: c.top + c.height * 0.78 }
    }
    K.feet = feet
    function feetTo(pt) {
      const f = field.getBoundingClientRect()
      const b = box()
      return { x: pt.x - f.left - b.x - b.w * 0.5, y: pt.y - f.top - b.y - b.h * 0.78 }
    }
    K.feetTo = feetTo
    function kHalt() {
      clearTimeout(arriveTimer)
      if (!K.walking) return
      K.walking = false
      C.set({ walkDir: 0 })
      const m = new DOMMatrixReadOnly(getComputedStyle(root).transform)
      kPlace({ x: m.m41, y: m.m42 }, 0)
    }
    K.halt = kHalt
    // 走过去：run 是小跑
    function kWalkTo(target, opt) {
      opt = opt || {}
      kHalt()
      const to = kClamp(target.x, target.y)
      const dist = Math.hypot(to.x - K.pos.x, to.y - K.pos.y)
      if (dist < 8) {
        if (opt.onArrive) opt.onArrive()
        return
      }
      const speed = Math.max(50, field.clientWidth * (opt.run ? 0.11 : 0.04) * (cfg.speed || 1))
      const ms = Math.round(Math.min(opt.run ? 5000 : 16000, Math.max(800, (dist / speed) * 1000)))
      K.sleeping = false
      if (!opt.nap) K.napAt = ''
      K.walking = true
      C.set({ pose: 'idle', walkDir: Math.sign(to.x - K.pos.x) || 1, run: !!opt.run })
      kPlace(to, ms)
      arriveTimer = setTimeout(() => {
        K.walking = false
        C.set({ walkDir: 0, run: false })
        if (opt.onArrive) opt.onArrive()
      }, ms)
    }
    K.walkTo = kWalkTo
    // 走到页面上的某个点；中途换了计划就不做到达后的事
    function kGo(pt, onArrive, opt) {
      const id = ++K.visitId
      if (!(opt && opt.nap)) K.napAt = ''
      kWalkTo(feetTo(pt), Object.assign({}, opt, { onArrive: () => { if (id === K.visitId && on() && onArrive) onArrive() } }))
    }
    K.go = kGo

    // 每只猫同一时间只做一件事。开始新计划（日常、追球、被逗、和谁一起玩、被拖、被取消）都先 begin()：
    // 旧计划的到达回调作废、停下脚步，占着的玩具 / 球 / 床位、配对、排队都让出来。
    // 延迟执行的动作先用 alive(v) 确认自己还是当前计划，不是就什么都不做。
    K.begin = () => {
      K.planV++
      K.visitId++
      kHalt()
      releaseHeld(K)
      K.playing = false
      K.pair = null
      K.queued = false
      K.lureV = -1
      if (!K.sleeping) K.napAt = ''
      if (C.ok && C.st.happy) C.set({ happy: false })
      // 正在和小 Claude 一起玩：猫换了计划，小 Claude 那边的互动也停下
      if (duoCat === K) {
        duoCat = null
        if (visiting && ['petcat', 'chase', 'ball', 'laser'].includes(visiting.kind)) cancelVisit()
      }
      // 接力扑球被打断：把接力交给下一只，不让后面的猫一直排队
      const hook = K.abortHook
      K.abortHook = null
      if (hook) setTimeout(hook, 0)
      return K.planV
    }
    K.alive = v => v === K.planV && on() && !K.drag

    function talk(text, ms) {
      sayNode.textContent = text
      bubbleBox.classList.toggle('is-empty', !text)
      bubbleBox.classList.remove('pop')
      void bubbleBox.offsetWidth
      bubbleBox.classList.add('pop')
      clearTimeout(sayTimer)
      sayTimer = setTimeout(() => bubbleBox.classList.add('is-empty'), ms || 2200)
    }
    K.say = talk
    K.line = list => pick(list).replace('{name}', K.name)

    // 猫身上的爱心、音符
    function hearts(kind, count) {
      for (let n = 0; n < count; n++) {
        const node = kind === 'heart' ? el('img', 'fx heart') : el('span', 'fx note', '♪')
        if (kind === 'heart') { node.src = HEART; node.alt = '' }
        node.style.left = (34 + n * 10 + Math.random() * 8) + '%'
        node.style.top = (22 + Math.random() * 10) + '%'
        node.style.animationDelay = (n * 0.2) + 's'
        node.addEventListener('animationend', () => node.remove())
        wrap.appendChild(node)
      }
    }
    K.fx = hearts

    function wake() {
      if (!K.sleeping) return
      K.sleeping = false
      K.napAt = ''
      C.set({ pose: 'idle' })
      C.play('stretch')
    }
    K.wake = wake

    function kRandomSpot() {
      const f = field.getBoundingClientRect()
      const side = document.querySelector('.side').getBoundingClientRect()
      const b = box()
      let spot
      const minY = Math.min(field.clientHeight - b.y - b.h * 0.8, groundTop() - f.top - b.y - b.h * 0.78)
      for (let n = 0; n < 12; n++) {
        spot = kClamp(rand(-b.x, field.clientWidth - b.x - b.w), rand(minY, field.clientHeight - b.y - b.h * 0.8))
        const left = f.left + spot.x + b.x + b.w * 0.2
        const top = f.top + spot.y + b.y + b.h * 0.3
        const isOverSide = left + b.w * 0.6 > side.left - 10 && left < side.right + 10 && top + b.h * 0.5 > side.top && top < side.bottom
        if (!isOverSide && !overStage(left, top, b.w * 0.6, b.h * 0.5)) break
      }
      return spot
    }
    K.randomSpot = kRandomSpot

    // 另一只猫正睡在同一个地方：挨着它睡（往旁边挪半个身位）
    function napPoint(where) {
      const spot = Home.spots[where] || Home.spots.bed
      const other = kitties.find(o => o !== K && o.napAt === where)
      return other ? { x: spot.x + box().w * 0.5 * (cfg.side || 1), y: spot.y + 3 } : spot
    }
    // 去睡一觉
    function nap(where, ms) {
      if (where === 'chair' && atDesk) where = 'bed'
      const pt = napPoint(where)
      K.napAt = where
      kGo(pt, () => {
        if (where !== 'bed' && where !== 'yard' && where !== 'door') C.play('hop')
        K.sleeping = true
        K.napAt = where
        C.set({ pose: 'sleep', face: Math.random() < 0.5 ? -0.9 : -2.24 })
        if (where === 'roof') talk('屋顶上暖和～', 2400)
        if (where === 'chair') talk('椅子是我的了', 2400)
        if (where === 'door') talk('门口晒太阳～', 2400)
        K.busyUntil = Date.now() + ms
      }, { nap: true })
      return true
    }
    K.nap = nap
    // 跳到某个面板顶上蹲着（猫就爱待在高处）
    function perch() {
      const panels = ['now', 'music', 'quota'].map(id => $(id)).filter(isShown)
      if (!panels.length) return false
      const r = pick(panels).getBoundingClientRect()
      kGo({ x: r.left + r.width * rand(0.25, 0.75), y: r.top + 4 }, () => {
        C.play('hop')
        C.set({ pose: 'loaf' })
        K.busyUntil = Date.now() + rand(8000, 15000)
      })
      return true
    }
    function followClawd() {
      if (insideHome) return false
      const c = clawdFeet()
      const side = Math.random() < 0.5 ? -1 : 1
      kGo({ x: c.x + side * box().w * 0.6, y: c.y + rand(-10, 20) }, () => {
        C.set({ pose: 'sit', face: side > 0 ? -2.24 : -0.9 })
        K.busyUntil = Date.now() + rand(4000, 8000)
      })
      return true
    }

    // 猫追球：跑过去扑一下，再把球拍出去
    function chaseBall() {
      if (!on() || isPaused || K.drag || ballDrag || (held.ball && held.ball !== K)) return false
      wake()
      const v = K.begin()
      held.ball = K
      const bp = ballPage()
      const side = bp.x > feet().x ? -1 : 1
      kGo({ x: bp.x + side * box().w * 0.42, y: bp.y }, () => {
        if (!K.alive(v)) return
        C.set({ face: side < 0 ? 0 : Math.PI })
        C.play('pounce')
        later(() => {
          if (!K.alive(v)) return
          C.play('bat')
          kickBall(-side, rand(-0.5, 0.5), rand(0.08, 0.18))
          talk(pick(['喵喵！', '抓到了！', '嘿！']), 1600)
          C.set({ face: side < 0 ? -0.9 : -2.24 })
          releaseHeld(K)
        }, 500)
        K.busyUntil = Date.now() + 3000
      }, { run: true })
      K.busyUntil = Date.now() + 8000
      return true
    }
    K.chaseBall = chaseBall

    // 自己玩毛线球：跑过去扑、拍出去一小段、再追上去，玩三到五个回合
    function playBall() {
      if (!on() || K.drag || ballDrag || held.ball) return false
      wake()
      const v = K.begin()
      const rounds = 3 + Math.floor(Math.random() * 3)
      K.busyUntil = Date.now() + 40000
      K.playing = true
      held.ball = K
      const ok = () => K.alive(v) && held.ball === K
      const round = n => {
        if (!ok()) return
        const bp = ballPage()
        const side = bp.x > feet().x ? -1 : 1
        kGo({ x: bp.x + side * box().w * 0.4, y: bp.y }, () => {
          if (!ok()) return
          C.set({ face: side < 0 ? 0 : Math.PI })
          C.play(n === 0 ? 'pounce' : pick(['bat', 'pounce', 'bat']))
          later(() => {
            if (!ok()) return
            C.play('bat')
            kickBall(-side * rand(0.6, 1), rand(-0.5, 0.5), rand(0.04, 0.09))
            if (n === 0 || Math.random() < 0.35) talk(pick(['喵喵！', '看我的！', '嘿嘿～', '抓住你了']), 1400)
            if (n + 1 < rounds) {
              later(() => round(n + 1), rand(900, 1500))
              return
            }
            K.busyUntil = Date.now() + 6000
            K.playing = false
            releaseHeld(K)
            later(() => {
              if (!K.alive(v)) return
              C.set({ pose: 'sit', face: side < 0 ? -0.9 : -2.24 })
              talk('玩累了～', 1600)
              if (clawdFree() && Math.random() < 0.4) say(K.line(['{name}玩得好开心', '{name}好厉害！']), 2000)
            }, 1200)
          }, 420)
        }, { run: true })
      }
      round(0)
      return true
    }

    // 扒拉猫爬架上挂的小玩具：站起来一下下拍，玩具跟着晃（同一时间只给一只猫玩）
    function playToy() {
      if (!on() || K.drag || !Home.spots.toy || held.toy) return false
      wake()
      const v = K.begin()
      K.busyUntil = Date.now() + 25000
      K.playing = true
      held.toy = K
      const ok = () => K.alive(v) && held.toy === K
      kGo(Home.spots.toy, () => {
        if (!ok()) return
        C.set({ pose: 'scratch', face: -0.9 })
        talk(pick(['够到了！', '喵！', '晃起来了～']), 1600)
        K.busyUntil = Date.now() + 6000
        let k = 0
        const swing = () => {
          if (!ok()) return
          C.play('bat')
          Home.set({ toy: [0.5, -0.4, 0.32, -0.22, 0.14, -0.08][k] })
          k++
          if (k < 6) later(swing, 450)
          else later(() => {
            if (!ok()) return
            K.playing = false
            releaseHeld(K)
            if (C.st.pose === 'scratch') C.set({ pose: 'sit' })
          }, 500)
        }
        later(swing, 300)
      }, { run: Math.random() < 0.5 })
      return true
    }

    // 被拖着晃的毛线球吸引：跑到球边伏低身子盯着（同一次拖球里只算一个计划，球挪了就重新瞄准）
    K.lure = bp => {
      if (!on() || K.drag) return
      if (K.lureV !== ballDragV || !K.alive(K.lureT)) {
        if (K.sleeping && Math.random() < 0.5) return
        wake()
        K.lureT = K.begin()
        K.lureV = ballDragV
        K.playing = true
      }
      const v = K.lureT
      K.busyUntil = Date.now() + 6000
      const side = bp.x > feet().x ? -1 : 1
      const id = ++K.visitId
      kWalkTo(feetTo({ x: bp.x + side * box().w * 0.5, y: bp.y + 2 }), {
        run: true,
        onArrive: () => {
          if (id !== K.visitId || !K.alive(v)) return
          C.set({ pose: 'crouch', face: side < 0 ? 0 : Math.PI })
        },
      })
    }
    // 这一次拖球吸引来的、还没被别的事叫走
    K.lured = v => K.lureV === v && K.alive(K.lureT)
    // 松手了：扑上去把球拍走。v：这次拖球的编号；t：入队时这只猫的计划编号；done：拍完以后交给下一只猫接力
    K.pounceBall = (v, t, done) => {
      let finished = false
      const finish = () => {
        if (finished) return
        finished = true
        K.abortHook = null
        if (done) done()
      }
      const valid = () => K.alive(t) && K.lureV === v && !ballDrag && v === ballDragV
      // 作废了：还挂着入队时那个计划的话收拾干净（让出球、起身），再交给下一只
      const quit = () => {
        K.abortHook = null
        if (K.alive(t)) {
          K.begin()
          if (C.st.pose === 'crouch') C.set({ pose: 'sit' })
        }
        finish()
      }
      if (!valid()) return quit()
      // 半路被别的计划打断（哈气、被拖……）：begin() 会调用它，接力继续
      K.abortHook = finish
      K.queued = false
      held.ball = K
      const bp = ballPage()
      const side = bp.x > feet().x ? -1 : 1
      kGo({ x: bp.x + side * box().w * 0.38, y: bp.y }, () => {
        if (!valid()) return quit()
        C.set({ pose: 'idle', face: side < 0 ? 0 : Math.PI })
        C.play('pounce')
        later(() => {
          if (!valid()) return quit()
          C.play('bat')
          kickBall(-side * rand(0.6, 1), rand(-0.5, 0.5), rand(0.06, 0.14))
          talk(pick(['抓到了！', '喵呜！', '是我的！', '嘿！']), 1500)
          K.abortHook = null
          K.playing = false
          K.lureV = -1
          releaseHeld(K)
          K.busyUntil = Date.now() + 4000
          later(finish, 900)
        }, 450)
      }, { run: true })
    }

    // 各种日常：权重来自性格（cfg.weights 里的倍数）
    const W = cfg.weights || {}
    const w = (key, base) => base * (W[key] == null ? 1 : W[key])
    const ACTS = [
      [w('walk', 3), () => { wake(); kWalkTo(kRandomSpot()); return true }],
      [w('sit', 2), () => { C.set({ pose: 'sit' }); if (Math.random() < 0.4) C.play('slowblink'); K.busyUntil = Date.now() + rand(6000, 12000); return true }],
      [w('loaf', 2), () => { C.set({ pose: 'loaf' }); K.busyUntil = Date.now() + rand(10000, 20000); return true }],
      [w('groom', 2), () => { const v = K.planV; C.set({ pose: 'groom' }); K.busyUntil = Date.now() + 5000; later(() => { if (K.alive(v) && C.st.pose === 'groom') C.set({ pose: 'sit' }) }, 4500); return true }],
      [w('nap', 2), () => nap(pick(cfg.napSpots), rand(25000, 50000))],
      [w('eat', 1), () => { kGo(Home.spots.bowl, () => { C.set({ pose: 'eat', face: -0.9 }); talk('吧唧吧唧', 2000); K.busyUntil = Date.now() + 6000 }); return true }],
      [w('scratch', 1), () => { kGo(Home.spots.post, () => { C.set({ pose: 'scratch', face: 0 }); talk('嚓嚓嚓', 1800); K.busyUntil = Date.now() + 4500; const v = K.planV; later(() => { if (K.alive(v) && C.st.pose === 'scratch') C.set({ pose: 'sit' }) }, 4200) }); return true }],
      [w('perch', 1.5), () => perch()],
      [w('follow', 2), () => followClawd()],
      [w('ball', 2.5), () => playBall()],
      [w('toy', 2), () => playToy()],
      [w('belly', 1), () => { C.set({ pose: 'belly' }); talk('翻肚皮～', 2000); K.busyUntil = Date.now() + rand(5000, 9000); return true }],
    ]

    function think() {
      thinkTimer = 0
      if (!on() || isPaused || K.drag || ballDrag) return schedule()
      // 还在路上、排队等着扑球：等忙完再想下一件事
      if (K.walking || K.queued) return schedule(2500)
      const now = Date.now()
      if (now < K.busyUntil) return schedule(K.busyUntil - now + 300)
      // 小 Claude 睡在屋里：猫也回窝睡
      if (insideHome) {
        if (!K.sleeping) {
          K.begin()
          nap('bed', 60000)
        }
        return schedule(20000)
      }
      wake()
      K.begin()
      const total = ACTS.reduce((n, a) => n + a[0], 0)
      let roll = Math.random() * total
      for (const [weight, act] of ACTS) {
        roll -= weight
        if (roll <= 0) {
          act()
          break
        }
      }
      schedule()
    }
    function schedule(delay) {
      clearTimeout(thinkTimer)
      if (!on() || isPaused) return
      thinkTimer = setTimeout(think, delay != null ? delay : rand(5000, 12000))
    }
    K.schedule = schedule
    K.stop = () => { clearTimeout(thinkTimer); thinkTimer = 0 }
    K.free = () => on() && !K.walking && !K.drag && !K.sleeping && !K.queued && Date.now() > K.busyUntil

    // 互动被取消（暂停、拖动、进屋……）：当前计划作废（停下、让出东西），本来要在定时器里做的复原直接做掉。
    // 睡着的猫接着睡
    K.onCancel = () => {
      if (!C.ok) return
      if (K.sleeping) {
        K.pair = null
        releaseHeld(K)
        K.playing = false
        K.queued = false
        return
      }
      K.begin()
      if (['scratch', 'groom', 'crouch'].includes(C.st.pose)) C.set({ pose: 'sit' })
    }

    // ---- 你和这只猫：点它喵一声，连点会哈气跑开，来回摸它会呼噜（摸久了翻肚皮），能拎起来 ----
    let clicks = []
    let suppressClick = false
    let turns = []
    let lastDir = 0
    let lastX = 0
    let lastPurr = 0
    let lookKey = ''
    hit.addEventListener('click', () => {
      if (suppressClick) return
      noteActivity()
      wake()
      const now = Date.now()
      clicks = clicks.filter(t => now - t < 2000).concat(now)
      if (clicks.length >= 5) {
        clicks = []
        const v = K.begin()
        C.play('hiss')
        talk('哈！', 1600)
        K.busyUntil = now + 6000
        later(() => { if (K.alive(v)) kWalkTo(kRandomSpot(), { run: true }) }, 900)
        // 小 Claude 看见了
        if (clawdFree() && Math.random() < 0.6) say(K.line(['别欺负{name}啦', '{name}生气了！']), 2200)
        return
      }
      C.play(Math.random() < 0.7 ? 'meow' : 'hop')
      talk(K.line(cfg.lines.click), 1800)
      K.busyUntil = Math.max(K.busyUntil, now + 3000)
    })

    // 拎起来拖走
    hit.addEventListener('mousedown', ev => {
      if (ev.button !== 0 || isPaused) return
      K.drag = { sx: ev.clientX, sy: ev.clientY, ox: 0, oy: 0, moved: false }
    })
    function dragMove(ev) {
      const dx = ev.clientX - K.drag.sx
      const dy = ev.clientY - K.drag.sy
      if (!K.drag.moved) {
        if (Math.hypot(dx, dy) < 6) return
        K.sleeping = false
        K.begin()
        cancelActs()
        K.drag.moved = true
        K.drag.ox = K.pos.x
        K.drag.oy = K.pos.y
        C.set({ dragging: true, pose: 'idle' })
        talk(cfg.lines.lifted, 60000)
      }
      kPlace({ x: K.drag.ox + dx, y: K.drag.oy + dy }, 0)
    }
    function finishDrag() {
      if (!K.drag) return
      const wasMoved = K.drag.moved
      K.drag = null
      if (!wasMoved) return
      C.set({ dragging: false })
      C.play('hop')
      talk('哼！', 1600)
      K.busyUntil = Date.now() + 6000
      suppressClick = true
      setTimeout(() => (suppressClick = false), 0)
    }
    K.finishDrag = finishDrag
    document.addEventListener('mouseup', () => finishDrag())
    window.addEventListener('blur', () => finishDrag())
    document.addEventListener('mousedown', ev => {
      if (K.drag && !hit.contains(ev.target)) finishDrag()
    }, true)

    document.addEventListener('mousemove', ev => {
      if (isPaused || !on()) return
      if (K.drag) {
        dragMove(ev)
        return
      }
      const r = K.walking || !rect ? (rect = hit.getBoundingClientRect()) : rect
      // 头转向鼠标（离得远就慢慢看过来）；拖着毛线球时盯着球
      const cx = r.left + r.width / 2
      const cy = r.top + r.height * 0.3
      const reach = window.innerWidth * 0.35
      const nx = Math.max(-1, Math.min(1, (ev.clientX - cx) / reach))
      const ny = Math.max(-1, Math.min(1, (ev.clientY - cy) / reach))
      if (!K.walking && !K.sleeping) {
        let d = Math.atan2(-1, nx * 1.5) - C.st.yaw
        while (d > Math.PI) d -= Math.PI * 2
        while (d < -Math.PI) d += Math.PI * 2
        const yaw = Math.round(Math.max(-0.8, Math.min(0.8, d)) * 10) / 10
        const pitch = Math.round(-ny * 0.3 * 10) / 10
        const key = yaw + '|' + pitch
        if (key !== lookKey) {
          lookKey = key
          C.look(yaw, pitch)
        }
      }
      if (ballDrag) return
      // 在猫身上来回摸
      const now = Date.now()
      const padX = r.width * 0.15
      const padY = r.height * 0.15
      const isInside = ev.clientX >= r.left - padX && ev.clientX <= r.right + padX && ev.clientY >= r.top - padY && ev.clientY <= r.bottom + padY
      if (isInside) {
        if (K.walking) K.begin()
        K.busyUntil = Math.max(K.busyUntil, now + 3000)
        const step = ev.clientX - lastX
        if (Math.abs(step) > 2) {
          const dir = Math.sign(step)
          if (lastDir && dir !== lastDir) turns = turns.filter(t => now - t < 2000).concat(now)
          lastDir = dir
        }
        if (turns.length >= 4 && now - lastPurr > 3000) {
          turns = []
          const isAgain = now - lastPurr < 10000
          lastPurr = now
          wake()
          hearts('heart', 3)
          C.set({ happy: true })
          setTimeout(() => C.set({ happy: false }), 2400)
          if (isAgain) {
            C.set({ pose: 'belly' })
            talk('翻肚皮了，再摸摸～', 2400)
            K.busyUntil = now + 7000
          } else {
            C.play('rub')
            talk(cfg.lines.purr, 2200)
            K.busyUntil = now + 5000
          }
          // 小 Claude 有点羡慕
          if (clawdFree() && Math.random() < 0.3) say('我也想摸～', 2000)
        }
      } else {
        turns = []
        lastDir = 0
      }
      lastX = ev.clientX
    }, { passive: true })

    K.playToy = playToy
    K.playBall = playBall
    kitties.push(K)
    return K
  }

  const catOn = () => kitties.some(K => K.on())
  // 煤球：黑白奶牛猫，好动，爱爬高、爱追球
  const K1 = makeKitty({
    cat: Cat3D, root: 'kitty', wrap: 'kittyWrap', hit: 'kittyHit', canvas: 'catCanvas', bubble: 'kbubble', say: 'ksay',
    name: '煤球', side: 1, speed: 1,
    napSpots: ['bed', 'bed', 'chair', 'roof'],
    weights: {},
    lines: { click: ['喵～', '喵？', '干嘛喵', '咪～', '{name}在呢'], lifted: '放我下来喵！', purr: '呼噜呼噜～' },
  })
  // 棉花：布偶，蓬松慵懒，爱摊着、爱翻肚皮、爱黏人，跑得慢一点
  const K2 = makeKitty({
    cat: Cat3D2, root: 'kitty2', wrap: 'kitty2Wrap', hit: 'kitty2Hit', canvas: 'cat2Canvas', bubble: 'k2bubble', say: 'k2say',
    name: '棉花', side: -1, speed: 0.85,
    napSpots: ['bed', 'door', 'yard', 'chair'],
    weights: { walk: 0.7, loaf: 1.6, nap: 1.4, belly: 2.2, perch: 0.4, follow: 1.5, ball: 0.8, toy: 0.8, scratch: 0.7 },
    lines: { click: ['咪呜～', '喵呜？', '嗯？', '{name}在这儿', '要摸摸吗'], lifted: '好高好高…', purr: '呼噜噜噜～' },
  })

  // ---- 毛线球：点一下轻轻一踢；按住往后拉是弹弓——拉得越远飞得越远，松手朝反方向飞出去 ----
  // 瞄准时猫会跑到预计的落点旁伏低身子盯着；球落地弹一下，离得近的猫先扑（接力）

  const yarn = $('yarn')
  // 飞行时地上的影子、弹弓的橡皮筋、抛物线预览点：都是一次性建好的小元素，平时隐藏
  const yarnShadow = el('div', 'yarn-shadow')
  field.insertBefore(yarnShadow, yarn)
  const sling = el('div', 'sling')
  field.insertBefore(sling, yarn)
  const aimDots = []
  for (let i = 0; i < 7; i++) {
    const d = el('span', 'aimdot')
    d.style.opacity = String(0.95 - i * 0.1)
    field.appendChild(d)
    aimDots.push(d)
  }
  let ball = { x: 0, y: 0 }
  let ballSpin = 0
  let ballDrag = null
  let ballDragV = 0
  let ballFlying = null
  const ballSize = () => yarn.offsetWidth || 30
  // 球能待的地方：屏幕里、地平线以下的草地上、右侧栏左边
  function clampBall(x, y) {
    const s = ballSize()
    const f = field.getBoundingClientRect()
    const side = document.querySelector('.side').getBoundingClientRect()
    const maxX = Math.min(field.clientWidth - s, side.left - 40 - f.left)
    return {
      x: Math.min(maxX, Math.max(s, x)),
      y: Math.min(field.clientHeight - s / 2, Math.max(s, groundTop() - f.top, y)),
    }
  }
  // lift：飞在空中离地的高度（像素），这时地上显示影子
  function ballPlace(x, y, ms, lift) {
    const s = ballSize()
    ball = clampBall(x, y)
    const h = lift || 0
    yarn.style.transition = ms ? 'transform ' + ms + 'ms cubic-bezier(.15,.7,.3,1)' : 'none'
    yarn.style.transform = 'translate(' + (ball.x - s / 2) + 'px,' + (ball.y - s / 2 - h) + 'px) rotate(' + ballSpin + 'deg)'
    if (h > 2) {
      const k = Math.max(0.45, 1 - h / (field.clientHeight * 0.5))
      yarnShadow.style.display = 'block'
      yarnShadow.style.opacity = String(k)
      yarnShadow.style.transform = 'translate(' + (ball.x - s / 2) + 'px,' + (ball.y + s * 0.2) + 'px) scale(' + k.toFixed(2) + ')'
    } else yarnShadow.style.display = 'none'
  }
  // 往 (dx, dy) 方向踢，power 是屏幕宽度的比例
  function kickBall(dx, dy, power) {
    if (ballDrag || ballFlying) return
    const len = Math.hypot(dx, dy) || 1
    const dist = field.clientWidth * power
    const from = ball
    const to = clampBall(from.x + (dx / len) * dist, from.y + (dy / len) * dist * 0.5)
    const real = Math.hypot(to.x - from.x, to.y - from.y)
    ballSpin += (real / ballSize()) * 115 * Math.sign(to.x - from.x || 1)
    ballPlace(to.x, to.y, Math.round(600 + real * 1.6))
  }
  const ballPage = () => {
    const f = field.getBoundingClientRect()
    return { x: f.left + ball.x, y: f.top + ball.y }
  }
  // 离球最近的猫（free：只挑闲着的）
  const nearestCat = (free) => {
    const bp = ballPage()
    let best = null
    let bestD = Infinity
    for (const K of kitties) {
      if (!K.on() || K.drag || (free && !K.free())) continue
      const f = K.feet()
      const d = Math.hypot(f.x - bp.x, f.y - bp.y)
      if (d < bestD) { bestD = d; best = K }
    }
    return best
  }

  // 抛物线飞过去：每帧算位置（不到两秒）；暂停了就直接落地。落地后顺着方向再弹一小下
  function flyBall(from, to, onLand) {
    const dist = Math.hypot(to.x - from.x, to.y - from.y)
    const dur = Math.max(450, Math.min(1500, 380 + dist * 0.9))
    const H = Math.min(field.clientHeight * 0.35, dist * 0.38)
    const dir = Math.sign(to.x - from.x || 1)
    const spin0 = ballSpin
    const t0 = performance.now()
    const fl = {}
    ballFlying = fl
    yarn.style.transition = 'none'
    const step = () => {
      if (ballFlying !== fl) return
      const u = isPaused ? 1 : Math.min(1, (performance.now() - t0) / dur)
      ballSpin = spin0 + dir * u * (dist / ballSize()) * 115
      ballPlace(from.x + (to.x - from.x) * u, from.y + (to.y - from.y) * u, 0, H * 4 * u * (1 - u))
      if (u < 1) {
        setTimeout(step, 16)
        return
      }
      ballFlying = null
      kickBall(to.x - from.x, (to.y - from.y) * 2, (dist * 0.15) / field.clientWidth)
      if (onLand) onLand()
    }
    step()
  }

  let ballClickSuppress = false
  yarn.addEventListener('click', () => {
    if (ballClickSuppress || ballFlying) return
    noteActivity()
    kickBall(rand(-1, 1), rand(-0.6, 0.6), rand(0.12, 0.25))
    const K = nearestCat(false)
    if (K && Math.random() < 0.8) {
      const v = K.planV
      later(() => { if (K.planV === v) K.chaseBall() }, 350)
    }
  })

  // 弹弓：最多拉开这么远；落点在反方向、拉开距离的 6 倍处
  const slingMax = () => Math.max(60, Math.min(160, field.clientWidth * 0.07))
  const SLING_POWER = 6
  function slingLanding(d) {
    return clampBall(d.ax - d.px * SLING_POWER, d.ay - d.py * SLING_POWER)
  }
  function hideAim() {
    sling.style.display = 'none'
    aimDots.forEach(n => { n.style.display = 'none' })
  }
  function drawAim(d) {
    // 橡皮筋：从原来的位置连到拉开的球
    const len = Math.hypot(d.px, d.py)
    sling.style.display = 'block'
    sling.style.width = len + 'px'
    sling.style.transform = 'translate(' + d.ax + 'px,' + d.ay + 'px) rotate(' + Math.atan2(d.py, d.px) + 'rad)'
    // 抛物线预览：七个点
    const from = ball
    const to = slingLanding(d)
    const H = Math.min(field.clientHeight * 0.35, Math.hypot(to.x - from.x, to.y - from.y) * 0.38)
    aimDots.forEach((n, i) => {
      const u = (i + 1) / 8
      n.style.display = 'block'
      n.style.transform = 'translate(' + (from.x + (to.x - from.x) * u) + 'px,' + (from.y + (to.y - from.y) * u - H * 4 * u * (1 - u)) + 'px)'
    })
  }

  yarn.addEventListener('mousedown', ev => {
    if (ev.button !== 0 || isPaused || ballFlying) return
    ev.stopPropagation()
    ballDragV++
    ballDrag = { sx: ev.clientX, sy: ev.clientY, ax: ball.x, ay: ball.y, px: 0, py: 0, moved: false, lureAt: 0 }
  })
  document.addEventListener('mousemove', ev => {
    if (!ballDrag || isPaused) return
    const d = ballDrag
    let dx = ev.clientX - d.sx
    let dy = ev.clientY - d.sy
    if (!d.moved) {
      if (Math.hypot(dx, dy) < 5) return
      d.moved = true
      yarn.classList.add('is-aiming')
      noteActivity()
    }
    const R = slingMax()
    const len = Math.hypot(dx, dy)
    if (len > R) {
      dx *= R / len
      dy *= R / len
    }
    d.px = dx
    d.py = dy
    ballSpin = (dx / R) * 40
    ballPlace(d.ax + dx, d.ay + dy, 0)
    drawAim(d)
    // 拉开了：每 0.7 秒让猫跑到预计的落点旁边盯着
    const now = Date.now()
    if (len > 20 && now - d.lureAt > 700) {
      d.lureAt = now
      const f = field.getBoundingClientRect()
      const to = slingLanding(d)
      const target = { x: f.left + to.x, y: f.top + to.y }
      kitties.forEach(K => K.lure(target))
    }
  }, { passive: true })

  // 松手：拉得太近就当没拉（球弹回原位）；否则发射。silent：被别的事打断时松开，不发射
  function finishBallDrag(silent) {
    if (!ballDrag) return
    const d = ballDrag
    ballDrag = null
    yarn.classList.remove('is-aiming')
    hideAim()
    if (!d.moved) return
    // 松手后浏览器还会补一个 click，别把它当成踢球
    ballClickSuppress = true
    setTimeout(() => (ballClickSuppress = false), 0)
    const v = ballDragV
    const lured = kitties.filter(K => K.lured(v))
    const pull = Math.hypot(d.px, d.py)
    if (silent || pull < 14) {
      ballPlace(d.ax, d.ay, 200)
      lured.forEach(K => {
        K.begin()
        if (K.C.st.pose === 'crouch') K.C.set({ pose: 'sit' })
      })
      return
    }
    const from = { x: ball.x, y: ball.y }
    flyBall(from, slingLanding(d), () => {
      if (v !== ballDragV) return
      const still = lured.filter(K => K.lured(v))
      if (!still.length) {
        const K = nearestCat(true)
        if (K && Math.random() < 0.7) K.chaseBall()
        return
      }
      // 离球近的先扑，拍完再轮到下一只（接力），不会两只叠在一起扑。
      // 排队的猫标成 queued：日常、和小 Claude 玩、两只猫互动都不会把它叫走
      const bp = ballPage()
      const queue = still
        .sort((a, b) => Math.hypot(a.feet().x - bp.x, a.feet().y - bp.y) - Math.hypot(b.feet().x - bp.x, b.feet().y - bp.y))
        .map(K => ({ K, t: K.lureT }))
      queue.forEach(it => { it.K.queued = true })
      const next = () => {
        const it = queue.shift()
        if (it) it.K.pounceBall(v, it.t, next)
      }
      later(next, 200)
      queue.slice(1).forEach(it => it.K.C.set({ pose: 'sit' }))
    })
    if (Math.random() < 0.5 && clawdFree()) say(pick(['好球！', '飞咯～', '哇，好远！']), 1600)
  }
  document.addEventListener('mouseup', () => finishBallDrag())
  window.addEventListener('blur', () => finishBallDrag())
  // 在别处松开了鼠标、这里没收到 mouseup：下一次在球以外的地方按下鼠标时松开球
  document.addEventListener('mousedown', ev => {
    if (ballDrag && !yarn.contains(ev.target)) finishBallDrag(true)
  }, true)

  // ---- 小 Claude 和猫一起玩 ----

  let duoTimer = 0
  // 正在和小 Claude 一起玩的那只猫：取消时一起停下
  let duoCat = null
  const clawdFree = () => opts.roam && !isPaused && !isWalking && !visiting && !drag && !isAsleep && !insideHome &&
    !BUSY.has(mainPhase) && !atDesk && Date.now() > restUntil

  function scheduleDuo(delay) {
    clearTimeout(duoTimer)
    if (!catOn() || isPaused) return
    duoTimer = setTimeout(duoTick, delay != null ? delay : rand(25000, 45000))
  }
  function duoTick() {
    duoTimer = 0
    const free = kitties.filter(K => K.free())
    if (clawdFree() && free.length && !ballDrag) {
      const K = pick(free)
      const v = K.begin()
      duoCat = K
      setTimeout(() => { if (duoCat === K) duoCat = null }, 20000)
      const acts = [[3, duoPet], [2, duoChase], [2, duoBall], [2, duoRub], [3, duoLaser]]
      const total = acts.reduce((n, a) => n + a[0], 0)
      let roll = Math.random() * total
      for (const [weight, act] of acts) {
        roll -= weight
        if (roll <= 0) {
          act(K, v)
          break
        }
      }
    }
    scheduleDuo()
  }

  // 撸猫：猫坐好，小 Claude 走过去摸头，猫呼噜呼噜，有时翻肚皮
  function duoPet(K, v) {
    const cf = K.feet()
    const side = cf.x > clawdFeet().x ? -1 : 1
    K.C.set({ pose: 'sit', face: side < 0 ? -2.24 : -0.9 })
    K.busyUntil = Date.now() + 16000
    visitPoint('petcat', { x: cf.x + side * K.box().w * 0.5, y: cf.y + 2 }, () => {
      if (!K.alive(v)) return false
      Pet3D.look(-side * 0.9, 0.12, -side * 0.5, -0.25)
      Pet3D.play('pet')
      say(K.line(['{name}乖～', '摸摸头～', '好软！', '{name}今天也很可爱']), 2400)
      K.C.set({ happy: true })
      K.fx('heart', 3)
      K.say(K.lines.purr, 2600)
      later(() => {
        if (!K.alive(v)) return
        K.C.set({ happy: false })
        if (Math.random() < 0.5) {
          K.C.set({ pose: 'belly' })
          K.say('翻肚皮！', 2000)
        }
      }, 2600)
    }, 5000)
  }

  // 猫扑小 Claude：猫先伏低扭屁股，小 Claude 撒腿就跑，猫追上去一扑
  function duoChase(K, v) {
    K.C.set({ pose: 'crouch' })
    K.busyUntil = Date.now() + 14000
    say('来追我呀！', 1800)
    const id = ++visitId
    setVisiting({ kind: 'chase' })
    later(() => {
      if (id !== visitId || !K.alive(v)) return
      const dest = randomSpot()
      const p = petBox()
      const f = field.getBoundingClientRect()
      const destFeet = { x: f.left + dest.x + p.x + p.w * 0.5, y: f.top + dest.y + p.y + p.h * 0.78 }
      walkTo(dest, {
        fast: true,
        onArrive: () => {
          if (id !== visitId) return
          restUntil = Date.now() + 5000
          scheduleWander(5000)
        },
      })
      later(() => {
        if (id !== visitId || !K.alive(v)) return
        const side = destFeet.x > K.feet().x ? -1 : 1
        K.C.set({ pose: 'idle' })
        K.go({ x: destFeet.x + side * K.box().w * 0.35, y: destFeet.y }, () => {
          if (!K.alive(v)) return
          K.C.set({ face: side < 0 ? 0 : Math.PI })
          K.C.play('pounce')
          later(() => {
            if (!K.alive(v)) return
            if (id === visitId) {
              Pet3D.play('dizzy')
              fx('star', 3)
              say('哎呀，被抓到了！', 2400)
            }
            K.say('喵！', 1600)
            K.C.set({ pose: 'sit', face: side < 0 ? -0.9 : -2.24 })
          }, 450)
          K.busyUntil = Date.now() + 5000
        }, { run: true })
      }, 800)
    }, 1300)
  }

  // 踢球：小 Claude 走到球边一脚踢出去，猫追着球扑，再拍回来
  function duoBall(K, v) {
    const bp = ballPage()
    const side = bp.x > clawdFeet().x ? -1 : 1
    K.busyUntil = Date.now() + 12000
    visitPoint('ball', { x: bp.x + side * petBox().w * 0.3, y: bp.y + 4 }, () => {
      if (!K.alive(v) || ballDrag) return false
      Pet3D.look(-side * 0.9, 0, -side * 0.5, 0)
      Pet3D.play('kick')
      later(() => {
        if (!K.alive(v) || ballDrag) return
        kickBall(-side, rand(-0.4, 0.4), rand(0.18, 0.32))
        say(pick(['看球！', '接着！', K.line(['{name}快追！'])]), 1800)
        later(() => { if (K.alive(v)) K.chaseBall() }, 300)
      }, 260)
    }, 4000)
  }

  // 猫跑过来蹭小 Claude
  function duoRub(K, v) {
    const c = clawdFeet()
    const side = Math.random() < 0.5 ? -1 : 1
    restUntil = Date.now() + 12000
    // 先把猫占住，路上别被别的念头叫走
    K.busyUntil = Date.now() + 12000
    K.go({ x: c.x + side * K.box().w * 0.42, y: c.y + 2 }, () => {
      if (!K.alive(v)) return
      K.C.set({ face: side > 0 ? Math.PI : 0, happy: true })
      K.C.play('rub')
      K.fx('heart', 2)
      K.say('蹭蹭～', 1800)
      Pet3D.look(side * 0.8, 0, side * 0.5, -0.2)
      beHappy(2200)
      say(K.line(['痒痒的～', '{name}在撒娇', '嘿嘿']), 2200)
      later(() => { if (K.alive(v)) K.C.set({ happy: false, face: side > 0 ? -2.24 : -0.9 }) }, 2400)
      K.busyUntil = Date.now() + 4000
    })
  }

  // 激光笔逗猫：小 Claude 站着拿激光笔，地上的小红点到处乱窜，闲着的猫追着红点跑，最后一起扑上去
  const laserDot = el('div', 'laser')
  laserDot.hidden = true
  field.appendChild(laserDot)
  function duoLaser(K0, v0) {
    const cats = [K0].concat(kitties.filter(K => K !== K0 && K.free()))
    const plans = cats.map(K => (K === K0 ? v0 : K.begin()))
    cats.forEach(K => {
      K.playing = true
      K.busyUntil = Date.now() + 20000
    })
    const id = ++visitId
    setVisiting({ kind: 'laser' })
    restUntil = Date.now() + 20000
    Pet3D.set({ holding: 'laser' })
    say(pick(['看这个！', K0.line(['{name}快看～']), '小红点来啦～']), 2000)
    const hops = 6 + Math.floor(Math.random() * 3)
    let n = 0
    const alive = () => id === visitId && !isPaused && !drag
    const catAlive = i => cats[i].alive(plans[i])
    const f = field.getBoundingClientRect()
    let dot = clawdFeet()
    const placeDot = (pt, ms) => {
      dot = pt
      laserDot.hidden = false
      laserDot.style.transition = ms ? 'transform ' + ms + 'ms cubic-bezier(.3,.7,.4,1)' : 'none'
      laserDot.style.transform = 'translate(' + (pt.x - f.left) + 'px,' + (pt.y - f.top) + 'px)'
    }
    // 红点下一站：小 Claude 附近的草地上，不跑到右侧栏下面
    const nextSpot = () => {
      const c = clawdFeet()
      const side = document.querySelector('.side').getBoundingClientRect()
      const W = field.clientWidth
      const x = Math.max(f.left + 20, Math.min(side.left - 50, c.x + rand(-0.3, 0.3) * W))
      const y = Math.max(groundTop() + 10, Math.min(f.bottom - 20, c.y + rand(-0.12, 0.18) * field.clientHeight))
      return { x, y }
    }
    const stop = () => {
      laserDot.hidden = true
      Pet3D.set({ holding: null })
      cats.forEach((K, i) => {
        if (!catAlive(i)) return
        K.begin()
        if (K.C.st.pose === 'crouch') K.C.set({ pose: 'sit' })
      })
      if (id === visitId) {
        setVisiting(null)
        restUntil = Date.now() + 3000
        scheduleWander(3000)
      }
    }
    const hop = () => {
      if (!alive()) return stop()
      const pt = nextSpot()
      placeDot(pt, 420)
      // 小 Claude 转过去照着红点
      const c = clawdFeet()
      Pet3D.look(Math.max(-0.9, Math.min(0.9, (pt.x - c.x) / (field.clientWidth * 0.3))) * 0.8, 0.1, 0, -0.3)
      // 猫追过去，到了伏低盯着
      cats.forEach((K, i) => {
        if (!catAlive(i)) return
        const kf = K.feet()
        const side = pt.x > kf.x ? -1 : 1
        K.go({ x: pt.x + side * K.box().w * 0.35, y: pt.y + 2 }, () => {
          if (catAlive(i)) K.C.set({ pose: 'crouch', face: side < 0 ? 0 : Math.PI })
        }, { run: true })
      })
      n++
      if (n < hops) later(hop, rand(1000, 1500))
      else later(finale, 1300)
    }
    // 最后一下：红点停住，猫一起扑上去，红点消失
    const finale = () => {
      if (!alive()) return stop()
      cats.forEach((K, i) => {
        if (!catAlive(i)) return
        K.visitId++
        K.halt()
        K.C.set({ pose: 'idle' })
        later(() => {
          if (!catAlive(i)) return
          K.C.play('pounce')
          later(() => {
            if (!catAlive(i)) return
            K.C.set({ pose: 'sit' })
            K.say(pick(['抓到了？', '咦，没了！', '喵？？', '在哪儿！']), 1800)
            K.playing = false
            K.busyUntil = Date.now() + 4000
          }, 600)
        }, i * 250)
      })
      later(() => {
        laserDot.hidden = true
        if (alive()) say(pick(['抓不到吧～', '嘿嘿，没了', '再来一次？']), 2000)
        later(stop, 900)
      }, 700)
    }
    placeDot(clawdFeet(), 0)
    later(hop, 500)
  }

  // ---- 两只猫一起玩：扑来扑去、碰鼻子、互相舔毛、挤在一起睡 ----
  // 开始时两只猫都进入新计划（va / vb），每一步都确认两只都还在这次互动里

  let pairTimer = 0
  function schedulePair(delay) {
    clearTimeout(pairTimer)
    if (kitties.filter(K => K.on()).length < 2 || isPaused) return
    pairTimer = setTimeout(pairTick, delay != null ? delay : rand(30000, 60000))
  }
  function pairTick() {
    pairTimer = 0
    if (!insideHome && !ballDrag && K1.free() && K2.free()) {
      const [A, B] = Math.random() < 0.55 ? [K1, K2] : [K2, K1]
      const acts = [[3, pairChase], [3, pairBoop], [2, pairGroom], [2, pairCuddle]]
      const total = acts.reduce((n, a) => n + a[0], 0)
      let roll = Math.random() * total
      for (const [weight, act] of acts) {
        roll -= weight
        if (roll <= 0) {
          startPair(A, B, act)
          break
        }
      }
    }
    schedulePair()
  }
  function startPair(A, B, act) {
    const va = A.begin()
    const vb = B.begin()
    const tok = {}
    A.pair = B.pair = tok
    act(A, B, va, vb)
  }
  // 两只猫都还在这次互动里（没被拖走、没被逗球叫走、没被取消）
  const stillPair = (A, B, va, vb) => A.alive(va) && B.alive(vb) && !!A.pair && A.pair === B.pair
  // 互动正常结束：只清理这一次互动自己的状态
  const endPair = (A, B, va, vb) => {
    if (!stillPair(A, B, va, vb)) return false
    A.playing = B.playing = false
    A.pair = B.pair = null
    A.busyUntil = B.busyUntil = Date.now() + 4000
    return true
  }

  // A 伏低扭屁股，B 拔腿就跑，A 追上去一扑，B 哈一口
  function pairChase(A, B, va, vb) {
    A.busyUntil = B.busyUntil = Date.now() + 15000
    A.playing = B.playing = true
    A.C.set({ pose: 'crouch', face: B.feet().x > A.feet().x ? 0 : Math.PI })
    A.say(pick(['盯——', '看我扑你！']), 1600)
    later(() => {
      if (!stillPair(A, B, va, vb)) return
      B.C.play('hop')
      B.say(pick(['喵呜！', '才不给你抓！']), 1400)
      B.walkTo(B.randomSpot(), { run: true })
      later(() => {
        if (!stillPair(A, B, va, vb)) return
        const bf = B.feet()
        const side = bf.x > A.feet().x ? -1 : 1
        A.go({ x: bf.x + side * A.box().w * 0.45, y: bf.y }, () => {
          if (!stillPair(A, B, va, vb)) return
          A.C.set({ face: side < 0 ? 0 : Math.PI })
          A.C.play('pounce')
          later(() => {
            if (!stillPair(A, B, va, vb)) return
            B.C.play(Math.random() < 0.5 ? 'hiss' : 'meow')
            B.say(pick(['哈！', '喵！', '烦死了～']), 1500)
            A.C.set({ pose: 'sit' })
            B.C.set({ pose: 'sit', face: side < 0 ? -2.24 : -0.9 })
            endPair(A, B, va, vb)
          }, 500)
        }, { run: true })
      }, 900)
    }, 1500)
  }

  // A 走过去，两只猫鼻子碰鼻子，慢慢眨眼
  function pairBoop(A, B, va, vb) {
    A.busyUntil = B.busyUntil = Date.now() + 12000
    A.playing = true
    const bf = B.feet()
    const side = bf.x > A.feet().x ? -1 : 1
    B.C.set({ pose: 'sit', face: side < 0 ? Math.PI : 0 })
    A.go({ x: bf.x + side * A.box().w * 0.62, y: bf.y + 1 }, () => {
      if (!stillPair(A, B, va, vb)) return
      A.C.set({ pose: 'idle', face: side < 0 ? 0 : Math.PI })
      A.C.play('meow')
      later(() => {
        if (!stillPair(A, B, va, vb)) return
        A.C.play('slowblink')
        B.C.play('slowblink')
        A.fx('heart', 2)
        B.say(pick(['碰鼻子～', '咪～', '喵呜']), 1800)
        endPair(A, B, va, vb)
        if (clawdFree() && Math.random() < 0.4) say(pick(['你俩感情真好', '碰鼻子！好可爱']), 2000)
      }, 700)
    })
  }

  // A 给 B 舔毛，B 眯眼享受
  function pairGroom(A, B, va, vb) {
    A.busyUntil = B.busyUntil = Date.now() + 14000
    A.playing = true
    const bf = B.feet()
    const side = bf.x > A.feet().x ? -1 : 1
    B.C.set({ pose: 'loaf' })
    A.go({ x: bf.x + side * A.box().w * 0.55, y: bf.y + 1 }, () => {
      if (!stillPair(A, B, va, vb)) return
      A.C.set({ pose: 'groom', face: side < 0 ? 0 : Math.PI })
      B.C.set({ happy: true })
      B.fx('heart', 2)
      A.say(pick(['舔舔～', '帮你理理毛']), 1800)
      later(() => {
        if (!stillPair(A, B, va, vb)) return
        B.C.set({ happy: false })
        if (A.C.st.pose === 'groom') A.C.set({ pose: 'sit' })
        endPair(A, B, va, vb)
      }, 4500)
    })
  }

  // 一起回窝挤着睡：A 先去，B 过一会儿跟过去挨着躺
  function pairCuddle(A, B, va, vb) {
    const ms = rand(30000, 50000)
    A.nap('bed', ms)
    B.busyUntil = Date.now() + 6000
    A.say('困了…', 1600)
    later(() => {
      if (!stillPair(A, B, va, vb)) return
      B.nap('bed', ms)
      A.pair = B.pair = null
    }, rand(1500, 3500))
  }

  // 显示 / 隐藏小屋和猫
  function applyHome() {
    const on = !!opts.home
    document.body.classList.toggle('no-home', !on)
    Cat3D.hide(!on)
    Cat3D2.hide(!on)
    if (!on) {
      halt()
      cancelVisit()
      cancelActs()
      finishBallDrag(true)
      kitties.forEach(K => {
        K.halt()
        K.visitId++
        K.finishDrag()
        K.stop()
      })
      setAtDesk(false)
      exitHome()
      clearTimeout(duoTimer)
      clearTimeout(pairTimer)
      scheduleWander()
    } else {
      setTimeout(() => {
        Home.resize()
        Cat3D.resize()
        Cat3D2.resize()
        kitties.forEach((K, i) => K.schedule(2000 + i * 1500))
        scheduleDuo()
        schedulePair()
      }, 100)
    }
  }

  // 工位缩放：按小 Claude 每格像素和小岛每格像素的比例（1.2 是正常大小时的比例），上下限 0.45～1.3
  function fitDesk() {
    if (!Home.ok || !Home.unitPx) return
    const home = Home.unitPx()
    const pet = $('pet').clientHeight / (2 * ACTOR_CAMERA.z * Math.tan(ACTOR_CAMERA.fov / 2))
    if (!home || !pet) return
    const k = Math.max(0.45, Math.min(1.3, pet / home / 1.2))
    Home.set({ deskScale: Math.round(k * 20) / 20 })
    // 座位挪了：已经坐着的重新摆上去，正在走过去的改走新位置
    if (atDesk && !drag) place(clawdFeetTo(Home.spots.seat), 0)
    else if (visiting && visiting.kind === 'desk') {
      cancelVisit()
      goToDesk()
    }
  }
  window.addEventListener('resize', () => setTimeout(fitDesk, 400))

  // 第一次摆放：两只猫在院子里挨着，毛线球在旁边
  function placeHomeActors() {
    if (!Home.spots.yard) return
    const y = Home.spots.yard
    K1.place(K1.feetTo(y), 0)
    K2.place(K2.feetTo({ x: y.x + K2.box().w * 0.85, y: y.y + 6 }), 0)
    const f = field.getBoundingClientRect()
    ballPlace(y.x - f.left - K1.box().w * 0.6, y.y - f.top + 10, 0)
  }


  // ---- 系统占用：每 2 秒问一次桥接服务（CPU、内存、NVIDIA 显卡）；暂停、关掉显示、演示模式时不问 ----

  let sysTimer = 0
  let sysCtl = null
  let showSys = true
  function setSysItem(id, pct, text) {
    const item = $(id + 'Item')
    item.hidden = pct == null
    if (pct == null) return
    setText(id, text)
    const bar = $(id + 'Bar')
    const tf = 'scaleX(' + (Math.max(0, Math.min(100, pct)) / 100).toFixed(3) + ')'
    if (bar.style.transform !== tf) bar.style.transform = tf
    item.classList.toggle('is-high', pct >= 85)
  }
  const num = v => (typeof v === 'number' && isFinite(v) ? v : null)
  const gb = v => (v >= 10 ? Math.round(v) : v.toFixed(1))
  function renderSys(d) {
    const cpu = num(d.cpu)
    const memUsed = num(d.memUsed)
    const memTotal = num(d.memTotal)
    const gpu = num(d.gpu)
    const vramUsed = num(d.vramUsed)
    const vramTotal = num(d.vramTotal)
    const temp = num(d.gpuTemp)
    setSysItem('sysCpu', cpu, cpu == null ? '' : Math.round(cpu) + '%')
    setSysItem('sysMem', memUsed != null && memTotal ? (memUsed / memTotal) * 100 : null,
      memUsed != null && memTotal ? gb(memUsed) + '/' + gb(memTotal) + 'G' : '')
    setSysItem('sysGpu', gpu, gpu == null ? '' : gpu + '%' + (temp != null ? ' ' + temp + '°' : ''))
    setSysItem('sysVram', vramUsed != null && vramTotal ? (vramUsed / vramTotal) * 100 : null,
      vramUsed != null && vramTotal ? gb(vramUsed) + '/' + gb(vramTotal) + 'G' : '')
    $('sys').hidden = cpu == null && memUsed == null
  }
  function stopSys() {
    clearTimeout(sysTimer)
    sysTimer = 0
    if (sysCtl) {
      sysCtl.abort()
      sysCtl = null
    }
  }
  function scheduleSys(delay) {
    clearTimeout(sysTimer)
    sysTimer = 0
    if (isPaused || isDemo || !showSys) return
    sysTimer = setTimeout(pollSys, delay)
  }
  async function pollSys() {
    sysTimer = 0
    if (isPaused || isDemo || !showSys || sysCtl) return
    const ctl = new AbortController()
    sysCtl = ctl
    const t = setTimeout(() => ctl.abort(), 1500)
    let data = null
    try {
      const res = await fetch(BRIDGE + '/sys', { cache: 'no-store', signal: ctl.signal })
      if (res.ok) data = await res.json()
    } catch (err) {}
    clearTimeout(t)
    // 期间被暂停取消了：这条结果作废
    if (sysCtl !== ctl) return
    sysCtl = null
    if (data && typeof data === 'object') renderSys(data)
    else $('sys').hidden = true
    scheduleSys(data ? 2000 : 10000)
  }

  // ---- 左上角的互动菜单：想看什么点什么（不改自动触发的频率） ----
  // 点了以后先让小 Claude 腾出手来（醒来、出屋、离开工位、停下手上的事），猫也先叫醒，再开始这个互动。
  // 玩完了如果 Claude 还在干活，它会自己回工位

  const playMenu = $('playMenu')
  const pmPanel = $('pmPanel')
  function setMenuOpen(open) {
    pmPanel.hidden = !open
    playMenu.classList.toggle('is-open', open)
    store.set('play-menu-open', open)
    if (open) updateMenu()
  }
  $('pmToggle').addEventListener('click', ev => {
    ev.stopPropagation()
    setMenuOpen(pmPanel.hidden)
  })
  // 没有小岛（关掉了）时，和猫有关的都点不了；回家按钮跟着屋里屋外变字
  function updateMenu() {
    const hasCats = catOn()
    const hasTwo = kitties.filter(K => K.on()).length >= 2
    pmPanel.querySelectorAll('button[data-act]').forEach(b => {
      const need = b.dataset.need
      b.disabled = (need === 'cat' && !hasCats) || (need === 'two' && !hasTwo) || (need === 'home' && !homeOn())
    })
    const nap = pmPanel.querySelector('button[data-act="nap"]')
    if (nap) nap.textContent = insideHome ? '叫醒' : '回家睡觉'
  }

  // 让小 Claude 腾出手来
  function freeClawd() {
    if (isAsleep) wake()
    if (napping) endNap()
    if (insideHome) exitHome()
    finishDrag()
    stopWalk()
    setAtDesk(false)
    restUntil = 0
  }
  // 挑一只猫：优先闲着的，其次离小 Claude 近的；叫醒它，开始新计划
  function takeCat() {
    const on = kitties.filter(K => K.on() && !K.drag)
    if (!on.length) return null
    const free = on.filter(K => K.free())
    const c = clawdFeet()
    const list = (free.length ? free : on).sort((a, b) =>
      Math.hypot(a.feet().x - c.x, a.feet().y - c.y) - Math.hypot(b.feet().x - c.x, b.feet().y - c.y))
    const K = list[0]
    K.wake()
    K.busyUntil = 0
    return K
  }
  const DUO = { laser: duoLaser, pet: duoPet, chase: duoChase, ball: duoBall, rub: duoRub }
  const PAIR = { pchase: pairChase, boop: pairBoop, groom: pairGroom, cuddle: pairCuddle }
  function runAct(act) {
    if (isPaused) return
    noteActivity()
    manualUntil = Date.now() + 20000
    if (DUO[act]) {
      freeClawd()
      const K = takeCat()
      if (!K) return
      // 激光笔会叫上另一只闲着的猫：先把它也叫醒
      if (act === 'laser') kitties.forEach(o => { if (o !== K && o.on() && !o.drag && o.sleeping) { o.wake(); o.busyUntil = 0 } })
      const v = K.begin()
      duoCat = K
      setTimeout(() => { if (duoCat === K) duoCat = null }, 20000)
      // 等小 Claude 停稳再开始
      setTimeout(() => { if (K.alive(v)) DUO[act](K, v) }, 150)
      return
    }
    if (PAIR[act]) {
      const two = kitties.filter(K => K.on() && !K.drag)
      if (two.length < 2) return
      two.forEach(K => { K.wake(); K.busyUntil = 0 })
      const [A, B] = Math.random() < 0.5 ? [two[0], two[1]] : [two[1], two[0]]
      startPair(A, B, PAIR[act])
      return
    }
    if (act === 'nap') {
      if (insideHome) {
        if (isAsleep) wake()
        else endNap()
      } else {
        freeClawd()
        goHomeNap(5 * 60000, true)
      }
      setTimeout(updateMenu, 300)
      return
    }
    // 小 Claude 自己的小动作
    freeClawd()
    if (act === 'wave') {
      Pet3D.play('wave')
      say(pick(['嗨～', '你好呀！', '我在这儿～']), 2200)
    } else if (act === 'flip') {
      Pet3D.play('flip')
      say('看我后空翻！', 1800)
    } else if (act === 'spin') {
      Pet3D.play('spin')
      say('转个圈～', 1600)
    }
    restUntil = Date.now() + 3000
    scheduleWander(3000)
  }
  pmPanel.addEventListener('click', ev => {
    const b = ev.target.closest('button[data-act]')
    if (!b || b.disabled) return
    ev.stopPropagation()
    runAct(b.dataset.act)
  })
  setMenuOpen(store.get('play-menu-open') === true)

  // ---- 时钟：每分钟刷新一次 ----

  const WEEK = ['日', '一', '二', '三', '四', '五', '六']
  let clockTimer = 0
  function tickClock() {
    const d = new Date()
    setText('time', String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'))
    setText('date', (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + WEEK[d.getDay()])
    clearTimeout(clockTimer)
    if (!isPaused) clockTimer = setTimeout(tickClock, 60000 - (d.getSeconds() * 1000 + d.getMilliseconds()) + 50)
  }

  // ---- 会话管理：原 claude-finder 的界面，数据来自桥接服务的 /finder/* ----
  // 滚动做了四条路，任意一条可用就能翻完：滚轮（Wallpaper Engine 转发的，或桥接服务读到的）、拖滚动条、点轨道、上下按钮。
  // 搜索：键盘进不了壁纸，点搜索框时桥接服务在同一位置弹出原生输入框（中文输入法可用），这里轮询取走打的字。
  const Finder = (() => {

    const STATUS_COLOR = { running: 'var(--st-run)', waiting: 'var(--st-wait)', error: 'var(--st-err)', review: 'var(--st-rev)' }

    const ICON = {
