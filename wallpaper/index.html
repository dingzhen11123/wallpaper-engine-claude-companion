    window.addEventListener('resize', () => setTimeout(resize, 250))
    setTimeout(resize, 0)
    r.onRestore(() => { drawFront(); draw(); updateSpots() })

    return {
      ok: true,
      spots,
      // 只有真的变了才重画
      set(patch) {
        let changed = false
        let lightChanged = false
        for (const k of Object.keys(patch)) {
          const v = k === 'light' ? patch[k].map(n => n.toFixed(3)).join(',') : patch[k]
          if (st[k] !== v) {
            st[k] = v
            changed = true
            if (k === 'light') lightChanged = true
          }
        }
        if (lightChanged) r.setLight(patch.light)
        const scaled = 'deskScale' in patch && changed
        if (scaled) updateDeskM()
        // 光照、工位大小变了椅背也要重画（drawFront 最后会把整个场景画回去）
        if ((lightChanged || scaled) && canvas.clientWidth) drawFront()
        else if (changed && canvas.clientWidth) draw()
        if (scaled) updateSpots()
      },
      // 椅子高度处，一格在页面上是多少像素
      unitPx() {
        const rect = canvas.getBoundingClientRect()
        const a = r.project(2, 2.8, -1.4)
        const b2 = r.project(2, 7.8, -1.4)
        return Math.abs(a[1] - b2[1]) * rect.height / 5
      },
      resize,
    }
  })()

  // ---- 3D 小猫：一个模板两种花色 ----
  // tuxedo（煤球）：圆脸，头顶和眼睛一圈是黑的，额头一道白往下连到白鼻口；黄绿色眼睛、粉鼻子；
  //   白肚子白爪子，背上和侧面有大黑斑，黑尾巴。
  // ragdoll（棉花）：海豹双色布偶，奶白长毛，背上浅棕、腰臀和两侧大块深棕，胸口白毛领；
  //   棕色面罩加白色倒 V，深棕耳朵，蓝眼睛，又粗又蓬的深棕大尾巴，整只更蓬一圈。
  // 身体朝 +x，脚底在 y=0。

  function makeCat3D(canvasId, kind) {
    const canvas = $(canvasId)
    const R = kind === 'ragdoll'
    const r = window.Voxel.create(canvas, ACTOR_CAMERA)
    const st = {
      pose: 'idle', walkDir: 0, run: false, dragging: false, happy: false,
      action: null, actionAt: 0, actionDur: 0,
      lookYaw: 0, lookPitch: 0, face: -0.9, yaw: -0.9, headYaw: 0, headPitch: 0,
      nextBlink: 1.5, blinkUntil: 0,
    }
    const ACTION_DUR = { meow: 0.7, pounce: 0.9, hiss: 1.3, stretch: 1.8, shake: 0.6, slowblink: 1.8, rub: 2.2, bat: 0.6, hop: 0.6 }
    const noop = () => {}
    if (!r) return { ok: false, set: noop, play: noop, look: noop, pause: noop, hide: noop, resize: noop, light: noop }

    const WHITE = [0.95, 0.94, 0.92]
    const BLACK = [0.1, 0.1, 0.11]
    const CREAM = [0.95, 0.91, 0.84]
    const FAWN = [0.72, 0.6, 0.5]
    const SEAL = [0.4, 0.29, 0.22]
    const DARKSEAL = [0.25, 0.18, 0.14]
    const PINK = [0.95, 0.62, 0.66]
    const EAR = [0.86, 0.55, 0.6]
    const EYE = R ? [0.5, 0.72, 0.96] : [0.8, 0.82, 0.42]
    const TAIL = R ? DARKSEAL : BLACK
    const EARC = R ? DARKSEAL : BLACK
    const PUPIL = [0.05, 0.05, 0.05]
    const SHINE = [1, 1, 1]

    // 转角度时走近路
    const turn = (from, to, k) => {
      let d = to - from
      while (d > Math.PI) d -= Math.PI * 2
      while (d < -Math.PI) d += Math.PI * 2
      return from + d * k
    }

    function poseAt(t, dt) {
      const p = {
        lift: 0, bodyY: 0, bodyPitch: 0, roll: 0, rollDrop: 0, bob: 0, sq: 1,
        leg: [0, 0, 0, 0].map(() => ({ swing: 0, lift: 0, fold: 0 })),
        headPitch: 0, headYaw: 0, headTilt: 0,
        tailA: 0.9, tailSwing: 0, tailCurl: 0,
        eyeS: 1, pupil: 0.3, haunch: false, shadow: 1, yawOffset: 0,
      }
      // 呼吸
      p.sq = 1 + Math.sin(t * 2) * 0.015
      if (t > st.nextBlink) { st.blinkUntil = t + 0.14; st.nextBlink = t + rand(2.5, 6) }
      if (t < st.blinkUntil) p.eyeS = 0.1
      let face = st.face
      let headYaw = st.lookYaw
      let headPitch = st.lookPitch

      const pose = st.dragging ? 'drag' : st.walkDir ? 'walk' : st.pose
      switch (pose) {
        case 'walk': {
          const ph = t * (st.run ? 15 : 9)
          // 对角线两条腿一起迈：左前和右后、右前和左后
          const off = [0, Math.PI, Math.PI, 0]
          p.leg.forEach((l, i) => {
            const s = Math.sin(ph + off[i])
            l.swing = s * (st.run ? 0.7 : 0.45)
            l.lift = Math.max(0, s) * (st.run ? 0.6 : 0.35)
          })
          p.bob = Math.abs(Math.sin(ph)) * (st.run ? 0.35 : 0.15)
          p.tailA = 0.35
          p.tailSwing = Math.sin(t * 4) * 0.2
          headPitch = Math.sin(ph * 2) * 0.04
          headYaw = 0
          face = st.walkDir > 0 ? 0 : Math.PI
          break
        }
        case 'sit':
        case 'groom': {
          p.bodyPitch = 0.62
          p.haunch = true
          p.leg[2].fold = p.leg[3].fold = 0.8
          p.tailA = 2.1
          p.tailSwing = 1.0 + Math.sin(t * 1.3) * 0.15
          p.tailCurl = 0.4
          if (pose === 'groom') {
            // 举起右前爪舔一舔
            p.leg[1].swing = -1.5 + Math.sin(t * 9) * 0.15
            p.leg[1].lift = 1.4
            headPitch = -0.35 + Math.sin(t * 9) * 0.06
            headYaw = 0.35
            p.eyeS = Math.min(p.eyeS, 0.2)
          }
          break
        }
        case 'loaf':
        case 'sleep': {
          // 揣手手：身子趴下，爪子收在胸口底下，尾巴绕过来
          p.bodyY = -1.75
          p.leg[2].fold = p.leg[3].fold = 1
          p.tailA = 1.85
          p.tailSwing = 1.25
          p.tailCurl = 0.55
          if (pose === 'sleep') {
            p.eyeS = 0.1
            headPitch = -0.28
            headYaw = 0.35
            p.sq = 1 + Math.sin(t * 1.2) * 0.035
          } else {
            p.tailSwing += Math.sin(t * 0.8) * 0.12
          }
          break
        }
        case 'belly': {
          // 翻肚皮：仰面躺着，四个爪子朝天
          p.roll = 2.7
          p.rollDrop = 2.2
          p.leg.forEach((l, i) => { l.swing = Math.sin(t * 1.6 + i) * 0.25; l.fold = 0.25 })
          p.tailA = 2.3
          p.tailSwing = Math.sin(t * 1.4) * 0.3
          p.eyeS = Math.min(p.eyeS, 0.25)
          headTilt = 0
          headYaw = 0.3
          break
        }
        case 'eat': {
          headPitch = -0.95 + Math.sin(t * 7) * 0.08
          headYaw = 0
          p.tailA = 0.6
          p.tailSwing = Math.sin(t * 2) * 0.25
          break
        }
        case 'scratch': {
          // 站起来挠抓柱：两只前爪轮流往下抓
          p.bodyPitch = 1.15
          p.haunch = true
          p.leg[0].swing = -0.9 + Math.sin(t * 13) * 0.45
          p.leg[1].swing = -0.9 - Math.sin(t * 13) * 0.45
          p.leg[0].lift = p.leg[1].lift = 1
          p.tailA = 0.5
          p.tailSwing = Math.sin(t * 5) * 0.3
          headYaw = 0
          break
        }
        case 'crouch': {
          // 准备扑：压低身子扭屁股，瞳孔放大
          p.bodyY = -0.9
          p.bodyPitch = -0.08
          p.yawOffset = Math.sin(t * 16) * 0.07
          p.tailA = 1.5
          p.tailSwing = Math.sin(t * 9) * 0.35
          p.pupil = 0.6
          headYaw = 0
          break
        }
        case 'drag': {
          // 被拎起来：身子拉长，腿和尾巴耷拉着，一脸不情愿
          p.sq = 1.12
          p.leg.forEach((l, i) => { l.swing = Math.sin(t * 6 + i * 1.4) * 0.35 })
          p.tailA = 2.9
          p.tailSwing = Math.sin(t * 3) * 0.2
          p.eyeS = Math.min(p.eyeS, 0.5)
          p.shadow = 0.35
          break
        }
        default: {
          // 站着：尾巴慢慢晃
          p.tailA = 0.55
          p.tailSwing = Math.sin(t * 1.5) * 0.35
        }
      }
      if (st.happy && pose !== 'sleep') {
        p.eyeS = Math.min(p.eyeS, 0.25)
      }

      if (st.action) {
        const u = (t - st.actionAt) / st.actionDur
        if (u >= 1) st.action = null
        else {
          const k = Math.sin(u * Math.PI)
          switch (st.action) {
            case 'meow': headPitch += k * 0.3; p.lift += k * 0.5; p.eyeS = Math.min(p.eyeS, 1 - k * 0.6); break
            case 'hop': p.lift += k * 2; break
            case 'pounce': p.lift += k * 3.6; p.bodyPitch += k * 0.25; p.leg[0].swing = p.leg[1].swing = -k * 0.9; p.pupil = 0.6; break
            case 'hiss': p.bodyY += k * 0.7; p.sq += k * 0.08; p.tailA = 0.1; p.roll += Math.sin(u * Math.PI * 10) * 0.04; p.eyeS = Math.min(p.eyeS, 0.45); break
            case 'stretch': p.bodyPitch -= k * 0.35; p.leg[0].swing = p.leg[1].swing = -k * 0.9; p.tailA = 0.3; p.eyeS = Math.min(p.eyeS, 1 - k * 0.8); break
            case 'shake': headYaw += Math.sin(u * Math.PI * 6) * 0.5; break
            case 'slowblink': p.eyeS = Math.min(p.eyeS, 1 - k * 0.92); break
            case 'rub': p.roll += Math.sin(u * Math.PI * 4) * 0.16; p.tailA = 0.25; p.eyeS = Math.min(p.eyeS, 0.3); break
            case 'bat': p.leg[1].swing = -k * 1.5; p.leg[1].lift = k * 1.2; break
          }
        }
      }

      const kk = Math.min(1, dt * 6)
      st.yaw = turn(st.yaw, face, kk)
      st.headYaw = lerp(st.headYaw, Math.max(-0.8, Math.min(0.8, headYaw)), kk)
      st.headPitch = lerp(st.headPitch, Math.max(-1, Math.min(0.35, headPitch)), kk)
      p.yaw = st.yaw + p.yawOffset
      p.headYaw = st.headYaw
      p.headPitch = st.headPitch
      return p
    }

    let headTilt = 0

    function draw(t, dt) {
      const p = poseAt(t, dt)
      if (!r.begin()) return
      const ss = 1 / (1 + p.lift * 0.12)
      r.shadow(chain(T(0, 0.02, 0), RY(p.yaw), S((R ? 14 : 13) * ss, 1, (R ? 7.2 : 6.5) * ss)), 0.42 * ss * p.shadow)
      r.boxes()

      let root = chain(T(0, p.lift, 0), RY(p.yaw))
      if (p.roll) root = chain(root, T(0, 4.2 - p.rollDrop, 0), RX(p.roll), T(0, -4.2, 0))
      // 身体以后胯为轴抬起来（坐下、站起来挠柱子）
      const body = chain(root, T(-2.8, 2.2 + p.bodyY, 0), RZ(p.bodyPitch), T(2.8, -2.2, 0), T(0, p.bob, 0), S(1, p.sq, 1))
      if (R) {
        // 布偶：奶白长毛，背上浅棕，腰臀和两侧大块深棕，胸口一圈白毛领，白肚子
        r.box(body, 0, 4.4, 0, 7.9, 4.6, 5.1, CREAM)
        r.box(body, -0.6, 6.35, 0, 5.2, 0.9, 5.25, FAWN)
        r.box(body, -2.4, 5.7, 0, 3.0, 1.9, 5.32, SEAL)
        r.box(body, -1.4, 4.9, 2.6, 3.6, 2.1, 0.14, SEAL)
        r.box(body, -1.0, 5.1, -2.6, 3.0, 1.8, 0.14, SEAL)
        r.box(body, 3.4, 3.9, 0, 1.5, 3.3, 4.5, WHITE)
        r.box(body, 0.6, 2.4, 0, 6.2, 0.7, 4.7, WHITE)
      } else {
        r.box(body, 0, 4.3, 0, 7.5, 4.2, 4.6, WHITE)
        r.box(body, -0.9, 6.0, 0, 4.2, 0.9, 4.75, BLACK)
        r.box(body, -1.7, 4.9, 2.33, 2.6, 1.9, 0.1, BLACK)
        r.box(body, -0.6, 5.3, -2.33, 1.8, 1.2, 0.1, BLACK)
      }

      // 尾巴：三节，一节节弯；布偶的又粗又蓬
      const tw = R ? 1.75 : 1
      const t1 = chain(body, T(-3.75 - (R ? 0.2 : 0), 5.6, 0), RZ(p.tailA), RX(p.tailSwing))
      r.box(t1, 0, 1, 0, 0.9 * tw, 2, 0.9 * tw, TAIL)
      const t2 = chain(t1, T(0, 2, 0), RZ(-0.45 + p.tailCurl), RX(p.tailSwing * 0.7))
      r.box(t2, 0, 1, 0, 0.85 * tw * 1.08, 2, 0.85 * tw * 1.08, TAIL)
      const t3 = chain(t2, T(0, 2, 0), RZ(-0.5 + p.tailCurl), RX(p.tailSwing * 0.5))
      r.box(t3, 0, 0.8, 0, 0.8 * tw, 1.6, 0.8 * tw, TAIL)
      if (R) r.box(chain(t3, T(0, 1.6, 0), RZ(-0.3 + p.tailCurl * 0.5)), 0, 0.6, 0, 1.1, 1.3, 1.1, TAIL)

      // 坐着时的大腿
      if (p.haunch) for (const s of [-1, 1]) r.box(root, -2.5, 1.4 + p.bodyY, s * (R ? 2.6 : 2.35), 3, 2.6, 0.8, R ? CREAM : WHITE)

      // 腿：前腿跟着身体，但保持竖直、自动伸长够到地面；后腿接在胯上，可以收起来
      const zs = R ? [-1.5, 1.5, -1.5, 1.5] : [-1.4, 1.4, -1.4, 1.4]
      p.leg.forEach((l, i) => {
        const isFront = i < 2
        let base
        let len
        if (isFront) {
          const grounded = p.lift < 0.3 && !p.roll
          len = grounded && !l.lift ? Math.max(0.35, 2.2 + p.bodyY + 5.4 * Math.sin(p.bodyPitch)) : 2.2
          base = chain(body, T(2.6, 2.2, zs[i]), RZ(-p.bodyPitch + l.swing))
        } else {
          len = Math.max(0.25, (2.2 + p.bodyY) * (1 - l.fold))
          base = chain(root, T(-2.8, 2.2 + p.bodyY, zs[i]), RZ(l.swing))
        }
        if (l.lift && isFront) len = 2.2 - Math.min(1, l.lift) * 0.6
        r.box(base, 0, -len / 2, 0, R ? 1.35 : 1.2, len, R ? 1.45 : 1.3, WHITE)
        r.box(base, 0.15, -len + 0.25, 0, 1.45, 0.5, 1.5, WHITE)
      })

      // 头
      const neck = chain(body, T(3.3, 4.8, 0), RZ(-p.bodyPitch * 0.85 + p.headPitch), RY(p.headYaw), RX(headTilt))
      const H = chain(neck, T(1.6, 1.4, 0))
      if (R) {
        // 布偶：棕色面罩，额头到鼻子一道白色倒 V（越往下越宽），白口鼻白下巴，两腮蓬蓬的
        r.box(H, 0, 0, 0, 3.7, 4.1, 4.8, SEAL)
        r.box(H, 0.15, -1.45, 0, 3.6, 1.2, 4.5, WHITE)
        r.box(H, 1.88, -0.7, 0, 0.25, 1.8, 2.9, WHITE)
        r.box(H, 1.88, 0.55, 0, 0.24, 1.1, 1.3, WHITE)
        r.box(H, 1.88, 1.3, 0, 0.24, 0.9, 0.7, WHITE)
        r.box(H, 1.88, 1.85, 0, 0.24, 0.5, 0.35, WHITE)
        r.box(H, 2.02, -0.15, 0, 0.18, 0.4, 0.6, PINK)
        for (const s of [-1, 1]) r.box(H, 0.3, -1.25, s * 2.5, 2.6, 1.8, 0.6, CREAM)
      } else {
        r.box(H, 0, 0, 0, 3.6, 4, 4.6, BLACK)
        r.box(H, 0.15, -1.45, 0, 3.5, 1.15, 4.3, WHITE)
        r.box(H, 1.85, -0.75, 0, 0.25, 1.7, 2.5, WHITE)
        r.box(H, 1.84, 0.85, 0, 0.22, 2.3, 0.8, WHITE)
        r.box(H, 1.98, -0.15, 0, 0.18, 0.4, 0.6, PINK)
      }
      const faceX = R ? 1.9 : 1.84
      const look = Math.max(-0.2, Math.min(0.2, -p.headYaw * 0.2))
      for (const s of [-1, 1]) {
        r.box(H, faceX, 0.45, s * 1.25, 0.16, Math.max(0.08, 0.95 * p.eyeS), 1, EYE)
        if (p.eyeS > 0.4) {
          r.box(H, faceX + 0.06, 0.45, s * 1.25 + look, 0.1, 0.82 * p.eyeS, p.pupil, PUPIL)
          r.box(H, faceX + 0.11, 0.72, s * 1.1, 0.05, 0.22, 0.22, SHINE, 0.4)
        }
        r.box(H, -0.2, 2.35, s * 1.45, 1.6, 1, 1.3, EARC)
        r.box(H, -0.2, 3.05, s * 1.6, 0.9, 0.7, 0.8, EARC)
        r.box(H, 0.62, 2.45, s * 1.45, 0.12, 0.75, 0.75, EAR)
        r.box(H, faceX + 0.06, -0.45, s * 2.2, 0.05, 0.05, 1.5, WHITE)
        r.box(H, faceX + 0.06, -0.75, s * 2.15, 0.05, 0.05, 1.4, WHITE)
      }
    }

    function fpsNow() {
      if (st.action) return 30
      if (st.walkDir || st.dragging) return 24
      if (st.pose === 'sleep') return 8
      return ['scratch', 'groom', 'eat', 'crouch'].includes(st.pose) ? 20 : 12
    }
    const loop = makeLoop(draw, fpsNow)

    function resize() {
      r.resize()
      loop.wake()
    }
    window.addEventListener('resize', resize)
    setTimeout(resize, 0)

    return {
      ok: true,
      st,
      set(patch) {
        if ('walkDir' in patch && !patch.walkDir && st.walkDir) st.face = st.walkDir > 0 ? -0.9 : -2.24
        Object.assign(st, patch)
        loop.wake()
      },
      play(name, dur) {
        st.action = name
        st.actionDur = dur || ACTION_DUR[name] || 1
        st.actionAt = performance.now() / 1000
        loop.wake()
      },
      look(yaw, pitch) { st.lookYaw = yaw; st.lookPitch = pitch; loop.wake() },
      pause: b => loop.pause(b),
      hide: b => loop.hide(b),
      light(rgb) { r.setLight(rgb); loop.wake() },
      resize,
    }
  }
  const Cat3D = makeCat3D('catCanvas', 'tuxedo')
  const Cat3D2 = makeCat3D('cat2Canvas', 'ragdoll')

  // ---- 天空和草地：按钟点在清晨、白天、黄昏、夜里之间渐变 ----
  // 颜色每 5 分钟算一次写进 CSS 变量；太阳、月亮沿弧线挪位置；小 Claude、猫、小屋的光照跟着变。
  // 云的飘动是每秒两格的 steps 动画，几乎不占资源。

  const SKY_KEYS = [
    // 钟点, 天顶, 地平线, 草地近处, 草地远处, 远山, 云, 光照, 星星, 四周压暗
    [0, '#0b1230', '#27305a', '#1d3727', '#2a4632', '#1e2c47', '#3a4566', [0.72, 0.74, 0.9], 1, 0.42],
    [4.8, '#0f1838', '#2f3866', '#1f3a29', '#2d4934', '#222f4c', '#414c6e', [0.72, 0.74, 0.9], 0.9, 0.4],
    [6, '#4f6ca3', '#f2b38c', '#4f7139', '#6c8a4c', '#8a87a4', '#f6d6c4', [0.95, 0.86, 0.8], 0.12, 0.3],
    [7.5, '#5fa5e4', '#cde7f6', '#5f9443', '#88b862', '#9ec3cb', '#ffffff', [1, 1, 1], 0, 0.2],
    [16.5, '#64a7e0', '#e0eeee', '#5f9443', '#88b862', '#a4c4c6', '#ffffff', [1, 0.98, 0.95], 0, 0.2],
    [18, '#56629f', '#f3a26f', '#557a3c', '#789a50', '#96798f', '#f9c9a8', [1, 0.86, 0.74], 0.1, 0.28],
    [19.3, '#141c40', '#333b6a', '#20392a', '#2e4a35', '#25334e', '#3f4a6c', [0.74, 0.76, 0.92], 0.85, 0.4],
    [24, '#0b1230', '#27305a', '#1d3727', '#2a4632', '#1e2c47', '#3a4566', [0.72, 0.74, 0.9], 1, 0.42],
  ]
  // 地平线在屏幕高度的一半；小 Claude 和猫随机溜达时只在地平线往下一点的草地上落脚
  const HORIZON = 0.5
  const groundTop = () => window.innerHeight * (HORIZON + 0.05)

  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16))
  const mixHex = (a, b, k) => {
    const x = hexRgb(a)
    const y = hexRgb(b)
    return 'rgb(' + x.map((v, i) => Math.round(v + (y[i] - v) * k)).join(',') + ')'
  }

  const Sky = (() => {
    const root = document.documentElement
    const sun = $('sun')
    const moon = $('moon')
    let timer = 0
    let lastKey = ''

    // 某个钟点的天色：在前后两个关键时刻之间插值
    function colorsAt(h) {
      let i = 0
      while (i < SKY_KEYS.length - 2 && h >= SKY_KEYS[i + 1][0]) i++
      const a = SKY_KEYS[i]
      const b = SKY_KEYS[i + 1]
      const k = Math.max(0, Math.min(1, (h - a[0]) / (b[0] - a[0])))
      const num = (x, y) => x + (y - x) * k
      return {
        sky1: mixHex(a[1], b[1], k), sky2: mixHex(a[2], b[2], k),
        g1: mixHex(a[3], b[3], k), g2: mixHex(a[4], b[4], k),
        hill: mixHex(a[5], b[5], k), cloud: mixHex(a[6], b[6], k),
        light: a[7].map((v, n) => num(v, b[7][n])),
        stars: num(a[8], b[8]), vig: num(a[9], b[9]),
      }
    }

    // 太阳 6:00～18:40、月亮 18:40～6:00，从左边升起、右边落下（右边有侧栏，弧线只走到屏幕七成处）
    function placeOrb(node, u) {
      const isUp = u > -0.02 && u < 1.02
      node.hidden = !isUp
      if (!isUp) return
      const W = window.innerWidth
      const H = window.innerHeight
      const x = W * (0.06 + u * 0.62)
      const y = H * HORIZON - Math.sin(Math.max(0, Math.min(1, u)) * Math.PI) * H * 0.36 + H * 0.03
      node.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px) translate(-50%, -50%)'
    }

    function apply() {
      clearTimeout(timer)
      timer = 0
      const d = new Date()
      const h = d.getHours() + d.getMinutes() / 60
      const c = colorsAt(h)
      const key = JSON.stringify(c) + window.innerWidth + 'x' + window.innerHeight
      if (key !== lastKey) {
        lastKey = key
        root.style.setProperty('--sky1', c.sky1)
        root.style.setProperty('--sky2', c.sky2)
        root.style.setProperty('--g1', c.g1)
        root.style.setProperty('--g2', c.g2)
        root.style.setProperty('--hill', c.hill)
        root.style.setProperty('--cloud', c.cloud)
        root.style.setProperty('--stars', c.stars.toFixed(2))
        root.style.setProperty('--vig', c.vig.toFixed(2))
        const dark = (rgb, k) => 'rgb(' + rgb.match(/\d+/g).map(v => Math.round(v * k)).join(',') + ')'
        root.style.setProperty('--tree', dark(c.g1, 0.68))
        root.style.setProperty('--tree2', dark(c.g1, 0.52))
        root.style.setProperty('--trunk', 'rgb(' + [104, 72, 50].map((v, i) => Math.round(v * c.light[i])).join(',') + ')')
        placeOrb(sun, (h - 6) / 12.67)
        placeOrb(moon, ((h - 18.67 + 24) % 24) / 11.33)
        const night = h >= 19 || h < 6
        Pet3D.light(c.light)
        Cat3D.light(c.light)
        Cat3D2.light(c.light)
        Home.set({ light: c.light, night })
      }
      if (!isPaused) timer = setTimeout(apply, 300000)
    }
    window.addEventListener('resize', () => setTimeout(apply, 300))

    // 种树：远山脚下一排小树，河两岸几棵大树和灌木（只摆一次，之后只跟着天色换颜色）
    const TREE_SVG = {
      pine: '<svg viewBox="0 0 40 62"><ellipse cx="20" cy="60" rx="13" ry="2" fill="rgba(0,0,0,.18)"/><rect class="tk" x="17" y="46" width="6" height="14"/><polygon class="t2" points="20,14 2,48 38,48"/><polygon class="t1" points="20,2 6,30 34,30"/></svg>',
      round: '<svg viewBox="0 0 40 62"><ellipse cx="20" cy="60" rx="14" ry="2" fill="rgba(0,0,0,.18)"/><rect class="tk" x="17" y="38" width="6" height="22"/><circle class="t2" cx="20" cy="24" r="16"/><circle class="t1" cx="14" cy="19" r="10"/><circle class="t1" cx="26" cy="17" r="9"/></svg>',
      bush: '<svg viewBox="0 0 40 24"><ellipse cx="20" cy="22" rx="17" ry="2" fill="rgba(0,0,0,.18)"/><circle class="t2" cx="12" cy="15" r="8"/><circle class="t2" cx="28" cy="15" r="8"/><circle class="t1" cx="20" cy="11" r="9"/></svg>',
    }
    // [横向 %, 纵向 %（树脚的位置）, 高度 vh, 种类, 远处]
    const TREES = [
      [3, 50.6, 2.6, 'round', 1], [8, 50.4, 3.2, 'pine', 1], [13, 50.8, 2.4, 'round', 1], [19, 50.5, 3.4, 'pine', 1],
      [25, 50.7, 2.6, 'round', 1], [31, 50.4, 3, 'pine', 1], [37, 50.8, 2.3, 'round', 1], [44, 50.5, 3.3, 'pine', 1],
      [50, 50.6, 2.5, 'round', 1], [55.5, 50.4, 3, 'pine', 1], [61, 50.7, 2.6, 'round', 1], [67, 50.5, 3.2, 'pine', 1],
      [73, 50.8, 2.4, 'round', 1], [79, 50.4, 3.1, 'pine', 1], [85, 50.6, 2.7, 'round', 1], [91, 50.5, 3.3, 'pine', 1], [97, 50.7, 2.5, 'round', 1],
      [55.5, 57.5, 7, 'round'], [54, 65, 9, 'pine'], [73.5, 56.5, 6.5, 'pine'], [76, 63, 8, 'round'], [79, 71, 10, 'round'],
      [86, 56, 6, 'pine'], [93, 60, 7, 'round'],
      [66.5, 63.5, 2.8, 'bush'], [55.5, 74, 3, 'bush'], [70.5, 79, 3.4, 'bush'], [52.5, 59, 2.4, 'bush'],
    ]
    const treesBox = $('trees')
    for (const [x, y, h, kind, far] of TREES) {
      const t = el('div', 'tree' + (far ? ' far' : ''))
      t.innerHTML = TREE_SVG[kind]
      t.style.left = x + '%'
      t.style.top = y + '%'
      t.style.height = h + 'vh'
      t.style.width = (h * (kind === 'bush' ? 40 / 24 : 40 / 62)) + 'vh'
      treesBox.appendChild(t)
    }

    return { apply, stop() { clearTimeout(timer); timer = 0 } }
  })()

  // ---- 满屏溜达，还会去「串门」：听歌、按下一首、看时钟、站到面板上、跑去找鼠标 ----

  const field = $('field')
  const buddy = $('buddy')
  const wrap = $('petWrap')
  const hit = $('petHit')
  let pos = { x: 0, y: 0 }
  let walkTimer = 0
  let arriveTimer = 0
  let isWalking = false
  let restUntil = 0
  // 从互动菜单手动点的互动：这之前别把小 Claude 叫回工位
  let manualUntil = 0
  let visiting = null
  let lastAutoNext = Date.now()
  let nextGap = rand(20, 40) * 60000
  let lastQuotaVisit = 0

  // 玩偶画布在 buddy 里的位置（布局值，不受动画影响）。身体只占画布中间一块：
  // 横向 30%~70%，脚底在 76% 高处，右手大约在 82% 宽、56% 高处
  const petBox = () => ({ x: wrap.offsetLeft, y: wrap.offsetTop, w: wrap.offsetWidth, h: wrap.offsetHeight })

  // 只要求玩偶身体留在屏幕里；画布空白、气泡贴边时被裁没关系。
  // slack：允许身体探出屏幕的宽度（去按贴边的按钮、躲在边上探头时用）
  let slack = 0
  function clampPos(x, y) {
    const p = petBox()
    const minX = -p.x - p.w * 0.28 - slack
    const maxX = field.clientWidth - p.x - p.w * 0.72 + slack
    const minY = -p.y - p.h * 0.18
    const maxY = field.clientHeight - p.y - p.h * 0.8
    return { x: Math.round(Math.min(maxX, Math.max(minX, x))), y: Math.round(Math.min(maxY, Math.max(minY, y))) }
  }
  // 歌词舞台显示着的时候也不停在它上面
  function overStage(left, top, w, h) {
    const box = $('music')
    if (box.hidden || box.offsetParent === null) return false
    const r = box.getBoundingClientRect()
    return left + w > r.left - 10 && left < r.right + 10 && top + h > r.top && top < r.bottom
  }
  // 随机落脚点：可以路过侧栏，但不停在侧栏上，免得挡住按钮
  function randomSpot() {
    const p = petBox()
    const f = field.getBoundingClientRect()
    const side = document.querySelector('.side').getBoundingClientRect()
    let spot
    const minY = Math.min(field.clientHeight - p.y - p.h * 0.8, groundTop() - f.top - p.y - p.h * 0.78)
    for (let n = 0; n < 12; n++) {
      spot = clampPos(rand(-p.x, field.clientWidth - p.x - p.w), rand(minY, field.clientHeight - p.y - p.h * 0.8))
      const left = f.left + spot.x + p.x + p.w * 0.25
      const top = f.top + spot.y + p.y + p.h * 0.3
      const isOverSide = left + p.w * 0.5 > side.left - 10 && left < side.right + 10 && top + p.h * 0.5 > side.top && top < side.bottom
      if (!isOverSide && !overStage(left, top, p.w * 0.5, p.h * 0.5)) break
    }
    return spot
  }
  // 屏幕中间偏左一点（右边是侧栏）
  function center() {
    const p = petBox()
    return clampPos(field.clientWidth * 0.38 - p.x - p.w / 2, field.clientHeight * 0.55 - p.y - p.h * 0.6)
  }

  function place(p, ms) {
    pos = clampPos(p.x, p.y)
    buddy.style.transition = ms ? 'transform ' + ms + 'ms linear' : 'none'
    buddy.style.transform = 'translate(' + pos.x + 'px,' + pos.y + 'px)'
    petRect = null
  }

  // 位置按屏幕比例存，换分辨率也不会跑出屏幕
  function savePos() {
    store.set('buddy-pos', { fx: pos.x / Math.max(1, field.clientWidth), fy: pos.y / Math.max(1, field.clientHeight) })
  }
  function loadPos() {
    const v = store.get('buddy-pos')
    if (v && isFinite(v.fx) && isFinite(v.fy)) return { x: v.fx * field.clientWidth, y: v.fy * field.clientHeight }
    return center()
  }

  function setVisiting(v) {
    visiting = v
    buddy.classList.toggle('visiting', !!v)
  }

  // 原地停下：停在眼下的位置
  function halt() {
    clearTimeout(arriveTimer)
    if (!isWalking) return
    isWalking = false
    Pet3D.set({ walkDir: 0 })
    const m = new DOMMatrixReadOnly(getComputedStyle(buddy).transform)
    place({ x: m.m41, y: m.m42 }, 0)
    updateDance()
  }

  // 取消正在进行的串门：到达后要做的事、还没按下去的按钮都作废
  let visitId = 0
  let pressTimers = []
  function cancelVisit() {
    visitId++
    pressTimers.forEach(clearTimeout)
    pressTimers = []
    document.querySelectorAll('.mctl .is-pressed').forEach(b => b.classList.remove('is-pressed'))
    setVisiting(null)
  }

  // 被打断（摸头、拖动、暂停、关掉溜达、睡着）：停下、取消串门，再重新安排下一次溜达
  function stopWalk() {
    halt()
    cancelVisit()
    cancelLook()
    scheduleWander()
  }

  // 走过去：3D 玩偶会真的转身朝着前进方向走；fast 是小跑，onArrive 到了以后做的事
  function walkTo(target, opt) {
    opt = opt || {}
    halt()
    setAtDesk(false)
    slack = opt.slack || 0
    const to = clampPos(target.x, target.y)
    const dist = Math.hypot(to.x - pos.x, to.y - pos.y)
    if (dist < 8) {
      if (opt.onArrive) opt.onArrive()
      return
    }
    const isFast = opt.fast || (opt.fastIfFar && dist > field.clientWidth * 0.3)
    // 速度跟屏幕大小走：平时每秒走屏幕宽度的 5%，小跑翻倍
    const speed = Math.max(60, field.clientWidth * (isFast ? 0.1 : 0.05))
    const ms = Math.round(Math.min(isFast ? 5000 : 14000, Math.max(900, (dist / speed) * 1000)))
    isWalking = true
    Pet3D.set({ walkDir: Math.sign(to.x - pos.x) || 1 })
    updateDance()
    place(to, ms)
    arriveTimer = setTimeout(() => {
      isWalking = false
      Pet3D.set({ walkDir: 0 })
      savePos()
      updateDance()
      if (opt.onArrive) opt.onArrive()
    }, ms)
  }

  // 把页面上某个元素换算成玩偶画布该放的位置：
  // press —— 右手正好按在元素中心；top —— 脚踩在元素上沿；beside —— 站在元素左边
  function spotFor(target, mode) {
    const f = field.getBoundingClientRect()
    const r = target.getBoundingClientRect()
    const p = petBox()
    if (mode === 'press') {
      return { x: r.left + r.width / 2 - f.left - p.x - p.w * 0.84, y: r.top + r.height / 2 - f.top - p.y - p.h * 0.56 }
    }
    if (mode === 'top') {
      return { x: r.left + r.width * rand(0.2, 0.6) - f.left - p.x - p.w * 0.5, y: r.top - f.top - p.y - p.h * 0.76 }
    }
    return { x: r.left - f.left - p.x - p.w * 0.74 - 12, y: r.top + r.height / 2 - f.top - p.y - p.h * 0.56 }
  }

  const isShown = n => !!n && n.offsetParent !== null && !n.hidden

  // 去串门：走到元素旁边，到了以后做点事，站 stay 毫秒
  function visit(kind, target, mode, onArrive, stay) {
    if (!isShown(target)) return false
    const hold = stay || 6000
    const id = ++visitId
    setVisiting({ kind })
    walkTo(spotFor(target, mode), {
      fast: kind === 'asking',
      fastIfFar: mode === 'top',
      slack: mode === 'press' ? petBox().w * 0.3 : 0,
      onArrive: () => {
        // 半路被取消或换了别的计划：到了也不做
        if (id !== visitId) return
        Pet3D.look(0, 0, 0, 0)
        if (onArrive) onArrive(id)
        restUntil = Date.now() + hold
        scheduleWander(hold)
      },
    })
    return true
  }

  const isPlaying = () => music.state === 'playing' && isShown($('music'))
  // 自己切歌的前提：允许、正在放、闲着、醒着、没被拖、没暂停
  const canAutoNext = () => opts.dj && isPlaying() && !BUSY.has(mainPhase) && !isAsleep && !drag && !isPaused

  // 伸手按「下一首」（真的会切歌）。真正发送前再确认一次，期间被取消就不按
  function pressNext(id) {
    const btn = document.querySelector('.mctl button[data-key="next"]')
    Pet3D.play('press')
    pressTimers.push(setTimeout(() => {
      if (id !== visitId || !canAutoNext()) return
      if (btn) btn.classList.add('is-pressed')
      send('/media', 'next')
      if (!mediaSeen) refreshMusic(800)
    }, 320))
    pressTimers.push(setTimeout(() => {
      if (btn) btn.classList.remove('is-pressed')
    }, 700))
  }

  // 原地小动作：随机挑一个，有的会配一句话
  const lastMouse = { x: 0, y: 0, at: 0 }
  const ACTIONS = [
    [3, () => Pet3D.play('hop')],
    [2, () => { Pet3D.play('bounce'); if (Math.random() < 0.3) say('嘿咻嘿咻～', 1800) }],
    [3, () => { Pet3D.play('spin'); if (Math.random() < 0.3) say('转个圈～', 1600) }],
    [2, () => { Pet3D.play('flip'); if (Math.random() < 0.4) say('看我后空翻！', 1800) }],
    [3, () => { Pet3D.play('wave'); if (Math.random() < 0.5) say(pick(['嗨～', '你好呀！', '今天也加油！', '我在这儿～']), 2200) }],
    [3, () => lookAround()],
    [2, () => { Pet3D.play('stretch'); if (Math.random() < 0.4) say('伸个懒腰～', 1800) }],
    [2, () => Pet3D.play('wiggle')],
    [2, () => Pet3D.play('tap')],
    [2, () => { Pet3D.play('nod'); if (Math.random() < 0.3) say(pick(['嗯嗯！', '好的好的', '对对对']), 1600) }],
  ]
  function doAction() {
    if (isWalking || drag || isAsleep || isPaused) return false
    const total = ACTIONS.reduce((n, a) => n + a[0], 0)
    let roll = Math.random() * total
    for (const [w, act] of ACTIONS) {
      roll -= w
      if (roll <= 0) {
        act()
        return true
      }
    }
    return false
  }
  // 左右张望：先看左、再看右、再回正
  let lookTimers = []
  function cancelLook() {
    lookTimers.forEach(clearTimeout)
    lookTimers = []
  }
  function lookAround() {
    cancelLook()
    const steps = [[-0.7, -0.5], [0.7, 0.5], [0, 0]]
    lookTimers = steps.map(([yaw, ex], n) => setTimeout(() => {
      if (isWalking || drag || isPaused || isAsleep) return
      Pet3D.look(yaw, 0, ex, 0)
    }, n * 800))
  }

  // 下一步做什么：要紧的事优先，其余随机。睡着了不动
  function wander() {
    if (drag || isPaused || !opts.roam || isAsleep) return scheduleWander()
    // 在屋里小憩、或者正在回家的路上：等它睡醒 / 走到
    if (insideHome || (visiting && (visiting.kind === 'nap' || visiting.kind === 'home'))) return scheduleWander()
    const now = Date.now()
    // 有活干：去电脑前（已经在路上或在工位就待着）
    if (shouldWork() && Date.now() > manualUntil) {
      goToDesk()
      return scheduleWander(8000)
    }
    if (now < restUntil) return scheduleWander(restUntil - now + 300)
    cancelVisit()
    const phase = mainPhase

    // 有会话等你回复：跑到那张卡片旁边举手
    if (phase === 'asking') {
      const askingSession = sessions.find(x => x.phase === 'asking')
      const target = askingSession ? Finder.rowOf(askingSession.id) : $('finder')
      if (!visit('asking', target, 'beside', () => say('这个会话在等你回复！', 5000), 15000)) walkTo(center())
      return scheduleWander()
    }

    // 额度用了八成以上：过去提醒一下（10 分钟最多一次）
    const high = document.querySelector('.quota-fill.is-high')
    if (high && now - lastQuotaVisit > 600000 && sessions.length) {
      lastQuotaVisit = now
      const row = high.closest('.quota-row')
      const pct = row.querySelector('b').textContent
      if (visit('quota', row, 'beside', () => say('额度用了 ' + pct + ' 了，悠着点～', 4000), 6000)) return
    }

    if (!BUSY.has(phase)) {
      // 隔一阵回屋小憩一会儿：白天至少隔 15 分钟，夜里（23 点到 7 点）隔 6 分钟、睡得更久
      const hour = new Date().getHours()
      const isNightTime = hour >= 23 || hour < 7
      if (homeOn() && now - lastNapAt > (isNightTime ? 6 : 15) * 60000 && Math.random() < (isNightTime ? 0.3 : 0.12)) {
        if (goHomeNap(rand(60000, 150000) * (isNightTime ? 2 : 1), false)) return scheduleWander()
      }
      // 将近一半的时候原地做个小动作，而不是一直走
      if (Math.random() < 0.45 && doAction()) return scheduleWander(rand(3500, 8000))
      // 放歌时偶尔自己去按「下一首」（间隔 20～40 分钟，可在设置里关掉）
      if (canAutoNext() && now - lastAutoNext > nextGap) {
        lastAutoNext = now
        nextGap = rand(20, 40) * 60000
        const btn = document.querySelector('.mctl button[data-key="next"]')
        if (visit('next', btn, 'press', id => {
          // 走过去的路上关掉了自动切歌、开始干活、被暂停：到了也不按
          if (!canAutoNext()) return
          say('听腻了，换一首！', 2500)
          pressNext(id)
        }, 1500)) return
      }
      const dice = Math.random()
      // 去播放器旁边听会儿歌
      if (isPlaying() && dice < 0.2) {
        if (visit('music', $('music'), 'beside', () => say(Math.random() < 0.5 ? '这首好听～' : '♪ 跟着哼一下', 3000), 9000)) return
      }
      // 跳到某个面板顶上站一会儿
      if (dice >= 0.2 && dice < 0.3) {
        const panels = ['now', 'music', 'quota'].map(id => $(id)).filter(isShown)
        const panel = panels.length ? pick(panels) : null
        if (panel && visit('perch', panel, 'top', () => {
          Pet3D.play('bounce')
          say(pick(['站得高看得远～', '我在这儿！', '这里风景不错']), 2600)
        }, 6000)) return
      }
      // 躲到屏幕边上探个头
      if (dice >= 0.3 && dice < 0.36) {
        const p = petBox()
        const isLeft = Math.random() < 0.5
        const x = isLeft ? -p.x - p.w * 0.6 : field.clientWidth - p.x - p.w * 0.4
        const id = ++visitId
        setVisiting({ kind: 'peek' })
        const f = field.getBoundingClientRect()
        walkTo({ x, y: rand(Math.min(field.clientHeight - p.y - p.h, groundTop() - f.top - p.y - p.h * 0.78), field.clientHeight - p.y - p.h) }, {
          slack: p.w * 0.3,
          onArrive: () => {
            if (id !== visitId) return
            Pet3D.look(isLeft ? 0.6 : -0.6, 0, isLeft ? 0.5 : -0.5, 0)
            say('偷看～', 2200)
            restUntil = Date.now() + 4000
            scheduleWander(4000)
          },
        })
        return
      }
      // 跑到鼠标旁边（最近 20 秒在桌面上动过鼠标才去）
      if (dice >= 0.36 && dice < 0.46 && Date.now() - lastMouse.at < 20000) {
        const f = field.getBoundingClientRect()
        const p = petBox()
        const side = lastMouse.x > f.left + pos.x + p.x + p.w / 2 ? -1 : 1
        const id = ++visitId
        setVisiting({ kind: 'chase' })
        walkTo({ x: lastMouse.x - f.left - p.x - p.w / 2 + side * p.w * 0.45, y: lastMouse.y - f.top - p.y - p.h * 0.6 }, {
          fast: true,
          onArrive: () => {
            if (id !== visitId) return
            setVisiting(null)
            Pet3D.play('bounce')
            say(pick(['抓到你啦！', '你在这儿～', '嘿！']), 2200)
            restUntil = Date.now() + 4000
            scheduleWander(4000)
          },
        })
        return
      }
      // 去看看几点了
      if (dice > 0.92) {
        const d = new Date()
        const hm = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0')
        if (visit('clock', $('time'), 'beside', () => say('现在 ' + hm + ' 啦', 3000), 5000)) return
      }
    }

    // 其余时候：闲着在全屏随便逛，忙的时候只在附近挪挪
    const isBusy = BUSY.has(phase)
    const far = Math.max(field.clientWidth, field.clientHeight) * (isBusy ? 0.06 : 0.22)
    let to = pos
    for (let n = 0; n < 8; n++) {
      const spot = isBusy
        ? clampPos(pos.x + rand(-0.15, 0.15) * field.clientWidth, Math.max(groundTop() - field.getBoundingClientRect().top - petBox().y - petBox().h * 0.78, pos.y + rand(-0.15, 0.15) * field.clientHeight))
        : randomSpot()
      to = spot
      if (Math.hypot(spot.x - pos.x, spot.y - pos.y) > far) break
    }
    walkTo(to)
    scheduleWander()
  }

  // 醒着又闲着时溜达得勤，干活时偶尔挪一下
  function scheduleWander(delay) {
    clearTimeout(walkTimer)
    if (isPaused || !opts.roam || isAsleep) return
    const wait = delay != null ? delay : BUSY.has(mainPhase) ? rand(25000, 60000) : rand(4000, 10000)
    walkTimer = setTimeout(wander, wait)
  }

  function onPhaseChange(before, phase) {
    noteActivity()
    if ((phase === 'working' || phase === 'thinking') && !(before === 'working' || before === 'thinking')) {
      // 在屋里小憩：起床去上班
      if (napping) endNap()
      cancelActs()
      restUntil = 0
      setTimeout(wander, 200)
    }
    if (!(phase === 'working' || phase === 'thinking')) leaveDesk()
    // 完成了：庆祝一下
    if (phase === 'done' && !isAsleep) Pet3D.play(Math.random() < 0.5 ? 'flip' : 'spin')
    // 有人等你回复：马上过去提醒（等卡片画出来再走）
    if (phase === 'asking' && opts.roam && !drag) {
      restUntil = 0
      setTimeout(wander, 50)
      return
    }
    if (before === 'asking') {
      cancelVisit()
      restUntil = 0
    }
    // 开始干活了：正要去切歌的话就算了
    if (BUSY.has(phase) && visiting && visiting.kind === 'next') cancelVisit()
    scheduleWander()
  }

  // ---- 睡觉 / 醒来：玩偶自己的心情 ----
  // 你在动鼠标、在放歌、Claude 在干活，都算有动静；很久没动静才睡

  function noteActivity() {
    lastActivity = Date.now()
    if (isAsleep) wake()
  }
  function wake() {
    isAsleep = false
    cancelVisit()
    exitHome()
    happyUntil = Date.now() + 2500
    Pet3D.play('stretch')
    say(pick(['醒啦！', '嗯…我没睡！', '早呀～']), 2400)
    scheduleWander(3000)
    setTimeout(safeRender, 2600)
  }
  let yawned = 0
  function checkSleep() {
    if (isPaused || napping) return
    if (isPlaying() || BUSY.has(mainPhase)) lastActivity = Date.now()
    const idle = Date.now() - lastActivity
    if (!isAsleep && idle > SLEEP_AFTER_MS - 60000 && yawned < lastActivity) {
      yawned = Date.now()
      Pet3D.play('yawn')
      say('好困啊…', 2400)
    }
    if (!isAsleep && !drag && idle > SLEEP_AFTER_MS) {
      isAsleep = true
      stopWalk()
      safeRender()
      goHomeToSleep()
    }
  }
  setInterval(checkSleep, 30000)

  // ---- 鼠标互动 ----

  let petRect = null
  const measure = () => (petRect = hit.getBoundingClientRect())
  const mainSession = () => sessions.find(s => s.id === mainId)

  function say(text, ms) {
    localLine = text
    localUntil = Date.now() + (ms || 2600)
    safeRender()
    setTimeout(safeRender, (ms || 2600) + 100)
  }

  // 告诉 Claude 里的玩偶：桌面上有人逗它（最多 4 秒一次）
  let lastPokeSent = 0
  function pokeClaude() {
    const main = mainSession()
    if (!main || Date.now() - lastPokeSent < 4000) return
    lastPokeSent = Date.now()
    send('/poke', main.id)
  }

  // 开心一下：眯眼笑
  function beHappy(ms) {
    happyUntil = Date.now() + ms
    safeRender()
    setTimeout(safeRender, ms + 50)
  }

  // 点一下：戳；短时间连点 5 下：晕
  const POKE_LINES = ['嘿嘿，被你发现了～', '别戳啦，痒！', '我在呢！', '要我做点什么吗？', '干嘛呀～']
  let clicks = []
  let suppressClick = false
  hit.addEventListener('click', () => {
    if (suppressClick) return
    noteActivity()
    const now = Date.now()
    clicks = clicks.filter(t => now - t < 2000).concat(now)
    if (clicks.length >= 5) {
      clicks = []
      halt()
      restUntil = now + 4000
      Pet3D.play('dizzy')
      fx('star', 3)
      say('晕了晕了～别戳了', 2400)
      return
    }
    Pet3D.play(pick(['hop', 'hop', 'wiggle', 'spin']))
    const main = mainSession()
    if (!(main && isSessionPose())) beHappy(1500)
    say(main && BUSY.has(main.phase) ? '我在忙呢，等我一下～' : pick(POKE_LINES))
    pokeClaude()
  })

  // 鼠标移动：身子和眼睛跟着转；在身上来回蹭：摸摸头；动一动就能叫醒它
  let lookTimer = 0
  let lastX = 0
  let lastDir = 0
  let turns = []
  let lastPet = 0
  let lookKey = ''
  document.addEventListener('mousemove', ev => {
    if (isPaused) return
    lastActivity = Date.now()
    lastMouse.x = ev.clientX
    lastMouse.y = ev.clientY
    lastMouse.at = lastActivity
    if (isAsleep) {
      wake()
      return
    }
    if (drag) {
      // Wallpaper Engine 转发的移动事件不带按键状态（ev.buttons 总是 0），所以这里不能用它判断松手
      dragMove(ev)
      return
    }
    // 走路时位置一直在变，每次都重新量
    const r = isWalking || !petRect ? measure() : petRect
    const cx = r.left + r.width / 2
    const cy = r.top + r.height * 0.35
    const dx = ev.clientX - cx
    const dy = ev.clientY - cy
    const reach = window.innerWidth * 0.4
    if (!isWalking) {
      // 身体最多转 40 度、抬头低头 12 度；眼睛在脸上挪一点。取整后才更新，省得每个像素都算
      const yaw = Math.round(Math.max(-1, Math.min(1, dx / reach)) * 0.7 * 20) / 20
      const pitch = Math.round(Math.max(-1, Math.min(1, dy / reach)) * 0.22 * 20) / 20
      const ex = Math.round(Math.max(-1, Math.min(1, dx / (r.width * 1.5))) * 0.5 * 10) / 10
      const ey = Math.round(Math.max(-1, Math.min(1, -dy / (r.height * 1.5))) * 0.35 * 10) / 10
      const key = yaw + '|' + pitch + '|' + ex + '|' + ey
      if (key !== lookKey) {
        lookKey = key
        Pet3D.look(yaw, pitch, ex, ey)
      }
    }
    // 鼠标停下 3 秒，眼睛和身子回正
    clearTimeout(lookTimer)
    lookTimer = setTimeout(() => {
      if (isWalking) return
      lookKey = ''
      Pet3D.look(0, 0, 0, 0)
    }, 3000)

    const now = Date.now()
    const padX = r.width * 0.2
    const padY = r.height * 0.2
    const isInside = ev.clientX >= r.left - padX && ev.clientX <= r.right + padX && ev.clientY >= r.top - padY && ev.clientY <= r.bottom + padY
    if (isInside) {
      // 鼠标凑到身上：走着的话先站住，看着你，让你摸得到
      if (isWalking && !drag) {
        stopWalk()
        restUntil = now + 5000
        scheduleWander(5000)
      } else if (now > restUntil - 2000) restUntil = now + 3000
      const step = ev.clientX - lastX
      if (Math.abs(step) > 2) {
        const dir = Math.sign(step)
        if (lastDir && dir !== lastDir) turns = turns.filter(t => now - t < 2000).concat(now)
        lastDir = dir
      }
      if (turns.length >= 4 && now - lastPet > 3000) {
        turns = []
        lastPet = now
        // 被摸的时候站住别走
        stopWalk()
        restUntil = now + 8000
        fx('heart', 3)
        beHappy(2200)
        Pet3D.play('wiggle')
        say('好舒服～', 2200)
        pokeClaude()
      }
    } else {
      turns = []
      lastDir = 0
    }
    lastX = ev.clientX
  }, { passive: true })

  const HEART = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7 6" shape-rendering="crispEdges" fill="#e58a8a">' +
    '<rect x="1" y="0" width="2" height="1"/><rect x="4" y="0" width="2" height="1"/><rect x="0" y="1" width="7" height="2"/>' +
    '<rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="3" y="5" width="1" height="1"/></svg>')
  // 一次性的小特效：爱心、音符、晕的星星，播完就删掉
  function fx(kind, count) {
    for (let n = 0; n < count; n++) {
      let node
      if (kind === 'heart') {
        node = el('img', 'fx heart')
        node.src = HEART
        node.alt = ''
      } else if (kind === 'star') {
        node = el('span', 'star')
        node.style.animationDelay = -(n * 0.53) + 's'
      } else {
        node = el('span', 'fx note', Math.random() < 0.5 ? '♪' : '♫')
      }
      if (kind !== 'star') {
        node.style.left = (34 + n * 9 + Math.random() * 8) + '%'
        node.style.top = (20 + Math.random() * 10) + '%'
        node.style.animationDelay = (n * 0.2) + 's'
      }
      node.addEventListener('animationend', () => node.remove())
      wrap.appendChild(node)
    }
  }

  // 按住拖走：腿在空中乱蹬；松手落地，先在那儿待一会儿再继续溜达
  let drag = null
  hit.addEventListener('mousedown', ev => {
    if (ev.button !== 0 || isPaused) return
    drag = { sx: ev.clientX, sy: ev.clientY, ox: 0, oy: 0, moved: false }
  })
  function dragMove(ev) {
    const dx = ev.clientX - drag.sx
    const dy = ev.clientY - drag.sy
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 6) return
      stopWalk()
      cancelActs()
      setAtDesk(false)
      slack = 0
      drag.moved = true
      drag.ox = pos.x
      drag.oy = pos.y
      buddy.classList.add('is-dragging')
      Pet3D.set({ dragging: true })
      updateDance()
      say('哇，飞起来了！', 60000)
    }
    place({ x: drag.ox + dx, y: drag.oy + dy }, 0)
  }
  document.addEventListener('mouseup', () => finishDrag())
  window.addEventListener('blur', () => finishDrag())
  // 在别处松开了鼠标、这里没收到 mouseup：下一次在玩偶以外的地方按下鼠标时结束拖动
  document.addEventListener('mousedown', ev => {
    if (drag && !hit.contains(ev.target)) finishDrag()
  }, true)
  function finishDrag() {
    if (!drag) return
    const wasMoved = drag.moved
    drag = null
    if (!wasMoved) return
    buddy.classList.remove('is-dragging')
    Pet3D.set({ dragging: false })
    cancelVisit()
    Pet3D.play('hop')
    say('放我下来啦～', 2000)
    savePos()
    restUntil = Date.now() + 45000
    scheduleWander()
    updateDance()
    // 松手后浏览器还会补一个 click，别把它当成戳
    suppressClick = true
    setTimeout(() => (suppressClick = false), 0)
  }

  // ---- 网易云音乐（系统媒体信息） ----
  // 主路：每秒问一次桥接服务（系统媒体信息）。网易云和 Folia 都认；Folia 还会报精确进度，网易云不报，只能计时。
  // 备用：桥接服务说没有歌时，用 Wallpaper Engine 的媒体集成报来的（别的播放器）。封面优先用媒体集成的。

  const music = { title: '', artist: '', cover: '', state: 'none', source: '' }
  // 封面都记下是哪首歌的，换歌后旧封面不会压住新歌
  let playVer = 0
  let mediaCover = { key: '', url: '' }
  let lyricCover = { key: '', url: '' }
  const songKeyNow = () => JSON.stringify([music.title, music.artist])
  // mediaSeen：媒体集成真的报来了歌曲信息（只是开关开着不算）
  let mediaSeen = false
  // 桥接服务正报着一首歌：媒体集成的歌名和状态先不用
  let playerLive = false
  let mediaSong = { title: '', artist: '', state: 'none' }
  // 这首歌的进度是播放器报的（不是计时估出来的）
  let precise = false
  // 这一轮播放器报的总时长：换歌时先用上，不等下一次对时
  let playerDur = 0
  let musicFails = 0
  let musicTimer = 0
  let musicCtl = null
  let lastSongKey = ''
  const STOPPED = '\u0000stopped'
  let noteTimer = 0
  let lastState = 'none'
  // ---- 歌词舞台：Folia 的歌词渲染放在 iframe 里（stage/，源码在 stage-src/），这里只传歌词和时钟 ----
  // 有歌才加载，歌停一分钟后卸载，不放歌时不占内存和显卡
  const Stage = (() => {
    let frame = null
    let ready = false
    let dropTimer = 0
    let lastSong = null
    let lastCover = ''
    let wePaused = false
    // 歌词样式：random 时每换一首歌随机换一种，不和上一首重复
    // Folia 的 17 种样式。轻量的只用 DOM 和 Canvas；其余要 WebGL，显卡占用高一些。用到才加载
    // 倾诉（tilt）在舞台里显示不出歌词，原因还没查清：先不进随机池，设置里还能手动选
    const LIGHT_MODES = ['claddagh', 'classic', 'cadenza', 'partita', 'fume', 'cappella', 'still', 'monet']
    const MODES = LIGHT_MODES.concat(['hanabi', 'lumiere', 'sonnet', 'tempera', 'diorama', 'machi', 'nebbia', 'pendolo'])
    let wanted = 'random'
    let songKey = ''
    const pool = () => (wanted === 'random-light' ? LIGHT_MODES : MODES)
    const isRandom = () => wanted === 'random' || wanted === 'random-light'
    const pickMode = last => pick(pool().filter(m => m !== last))
    const cfg = { mode: pickMode('') }
    const STAGE_URL = 'stage/index.html'
    const post = msg => {
      if (frame && ready && frame.contentWindow) frame.contentWindow.postMessage(msg, '*')
    }
    function mount() {
      if (frame) return
      frame = el('iframe', 'stage-frame')
      frame.setAttribute('scrolling', 'no')
      frame.tabIndex = -1
      // 画布按实际显示大小画，不画 1080p 再缩小：显卡负担按面积下降
      const scale = Math.max(0.4, Math.min(1, ($('stageHost').clientWidth || 1200) / 1920)) * (window.devicePixelRatio || 1)
      frame.src = STAGE_URL + '?dpr=' + scale.toFixed(2)
      ready = false
      $('stageHost').appendChild(frame)
      fit()
    }
    // Folia 的样式是按 1920×1080 排版的，窗口太小字会叠在一起：里面固定按这个尺寸排，外面整体缩放
    function fit() {
      if (!frame) return
      const w = $('stageHost').clientWidth
      if (w > 0) frame.style.transform = 'scale(' + w / 1920 + ')'
    }
    if (window.ResizeObserver) new ResizeObserver(fit).observe($('stageHost'))
    function unmount() {
      if (!frame) return
      frame.remove()
      frame = null
      ready = false
    }
    window.addEventListener('message', ev => {
      if (!frame || ev.source !== frame.contentWindow || !ev.data) return
      if (ev.data.type === 'stage-ready') {
        ready = true
        post(Object.assign({ type: 'config' }, cfg))
        if (lastSong) post(lastSong)
        if (lastCover) post({ type: 'cover', url: lastCover })
        post({ type: 'pause', value: wePaused })
        // 现算当前进度：存下来的旧位置放到现在已经过时了
        sendClock()
      } else if (ev.data.type === 'stage-error') console.error('[stage]', ev.data.message)
    })
    return {
      // 正在放才加载。没歌了等一分钟再卸载（切歌之间不用重新加载）；暂停着等五分钟，短暂停一下歌词还在。
      // 壁纸被暂停（全屏、窗口最大化）时不加载
      want(has) {
        if (document.body.classList.contains('hide-music')) {
          clearTimeout(dropTimer)
          dropTimer = 0
          return unmount()
        }
        // 壁纸暂停期间什么都不动，那个 15 秒的卸载计时要留着；恢复时会再调一次
        if (wePaused) return
        clearTimeout(dropTimer)
        dropTimer = 0
        if (has && music.state === 'playing') mount()
        else if (frame) dropTimer = setTimeout(unmount, has ? 300000 : 60000)
      },
      song(msg) {
        if (msg.key !== songKey) {
          songKey = msg.key
          if (isRandom()) {
            cfg.mode = pickMode(cfg.mode)
            // 重开整页，而不是在原页面里换：上一个样式的显存和 JS 堆才会真的释放
            if (frame && !wePaused) {
              unmount()
              mount()
            }
          }
        }
        lastSong = Object.assign({ type: 'song' }, msg)
        post(lastSong)
      },
      cover(url) {
        if (url === lastCover) return
        lastCover = url
        post({ type: 'cover', url })
      },
      clock(pos, playing) {
        post({ type: 'clock', pos, playing })
      },
      audio(msg) {
        post(msg)
      },
      isLive: () => !!frame && ready && !wePaused,
      setMode(mode) {
        wanted = mode
        cfg.mode = isRandom() ? pickMode(cfg.mode) : mode
        post(Object.assign({ type: 'config' }, cfg))
      },
      // 壁纸被暂停（全屏、窗口最大化）：停一小会儿还在就卸载，把内存和显存还回去；回来再加载
      pause(value) {
        wePaused = value
        post({ type: 'pause', value })
        clearTimeout(dropTimer)
        dropTimer = 0
        if (value) {
          if (frame) dropTimer = setTimeout(unmount, 15000)
        } else this.want(!!music.title)
      },
    }
  })()

  // Wallpaper Engine 听到的声音（左右声道各 64 段，0~1）折算成 Folia 的频段（0~255），让样式跟着节奏动。
  // 只在放歌、舞台开着时才算
  if (typeof window.wallpaperRegisterAudioListener === 'function') {
    let audioTick = 0
    const band = (a, from, to, boost) => {
      let sum = 0
      for (let i = from; i < to; i++) sum += (a[i] + a[i + 64]) / 2
      return Math.pow(Math.min(1, sum / (to - from)), boost) * 255
    }
    window.wallpaperRegisterAudioListener(a => {
      if (music.state !== 'playing' || !Stage.isLive() || !a || a.length < 128) return
      // 每秒 15 次够了，再多只是多费 CPU
      if (++audioTick % 2) return
      const spectrum = new Uint8Array(64)
      for (let i = 0; i < 64; i++) spectrum[i] = Math.min(255, ((a[i] + a[i + 64]) / 2) * 255)
      Stage.audio({
        type: 'audio', spectrum,
        power: band(a, 0, 6, 2),
        bass: band(a, 0, 3, 1.4),
        lowMid: band(a, 3, 8, 1.5),
        mid: band(a, 8, 20, 1.5),
        vocal: band(a, 16, 36, 1.3),
        treble: band(a, 36, 64, 1.5),
      })
    })
  }

  $('cover').addEventListener('error', () => { $('cover').hidden = true })

  const ICON_PLAY = 'M4 2l10 6-10 6z'
  const ICON_PAUSE = 'M3 2h4v12H3zM9 2h4v12H9z'

  function renderMusic() {
    const has = !!music.title
    const box = $('music')
    if (box.hidden === has) {
      box.hidden = !has
      Finder.updateThumb()
    }
    Stage.want(has)
    box.classList.toggle('is-playing', music.state === 'playing')
    setText('mtitle', music.title)
    setText('martist', music.artist)
    // 封面：优先用媒体集成报的；它没报（比如壁纸刚重载）就用桥接服务查歌词时顺带拿到的
    const nowKey = songKeyNow()
    music.cover = (lyricCover.key === nowKey && lyricCover.url) || (mediaCover.key === nowKey && mediaCover.url) || ''
    const cover = $('cover')
    if (music.cover) {
      if (cover.src !== music.cover) cover.src = music.cover
      cover.hidden = false
    } else cover.hidden = true
    Stage.cover(music.cover)
    $('ppIcon').firstChild.setAttribute('d', music.state === 'playing' ? ICON_PAUSE : ICON_PLAY)

    // 换歌：取歌词；如果是这时候才刚开始放，就能从头对齐
    const songKey = JSON.stringify([music.title, music.artist])
    if (has && songKey !== lastSongKey) {
      const isFirst = lastSongKey === ''
      lastSongKey = songKey
      onSongChange(isFirst)
      if (music.state === 'playing' && !isFirst && !BUSY.has(mainPhase) && !isAsleep) say('♪ 在听《' + music.title + '》', 3200)
    }
    // 停了：记下「已停止」，再放起来（哪怕还是同一首）就当新的一次从头计时
    if (!has && lastSongKey && lastSongKey !== STOPPED) {
      lastSongKey = STOPPED
      clearTimeout(lyric.timer)
      lyric.key = ''
      lyric.seq++
      stopClock()
      postTrack('stop', '', lastPlayed.title, lastPlayed.artist)
    }
    if (music.state !== lastState) {
      onPlayState(music.state)
      lastState = music.state
    }
    if (music.state === 'playing') noteActivity()
    updateDance()
  }

  // 放歌、醒着、闲着：跟着跳舞，隔一会儿冒个音符
  const isDancing = () => opts.dance && music.state === 'playing' && !isPaused && !isWalking && !isAsleep && !drag &&
    (!isSessionPose() || mainPhase === 'done')
  let dancingNow = false
  function updateDance() {
    const now = isDancing()
    Pet3D.set({ dancing: now })
    if (now !== dancingNow) {
      dancingNow = now
      renderPetBubble()
    }
    if (now && !noteTimer) {
      noteTimer = setInterval(() => fx('note', 1), 3800)
    } else if (!now && noteTimer) {
      clearInterval(noteTimer)
      noteTimer = 0
    }
  }

  $('music').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-key]')
    if (!b) return
    noteActivity()
    playVer++
    send('/media', b.dataset.key)
    // 备用路要等下一次轮询才知道新状态，先问一次；媒体集成偶尔会漏掉暂停 / 继续，也核对一次
    if (!mediaSeen) refreshMusic(800)
    else setTimeout(checkPlayState, 900)
  })
  // 向桥接服务核对一次真实的播放 / 暂停（系统媒体状态）。
  // 期间收到了新的播放事件（playVer 变了）、换了歌、或者歌名 / 歌手对不上，这条结果都作废
  async function checkPlayState() {
    if (isPaused || isDemo) return
    const ver = playVer
    const key = songKeyNow()
    const ctl = new AbortController()
    const t = setTimeout(() => ctl.abort(), 1500)
    let data = null
    try {
      const res = await fetch(BRIDGE + '/music', { cache: 'no-store', signal: ctl.signal })
      if (res.ok) data = await res.json()
    } catch (err) {}
    clearTimeout(t)
    if (!data || isPaused || ver !== playVer || key !== songKeyNow()) return
    if (data.state !== 'playing' && data.state !== 'paused') return
    const same = (a, b) => typeof a === 'string' && a.trim().toLowerCase() === b.trim().toLowerCase()
    if (!same(data.title, music.title)) return
    if (data.artist && music.artist && !same(data.artist, music.artist)) return
    if (music.state !== data.state) {
      music.state = data.state
      renderMusic()
    }
  }

  if (typeof window.wallpaperRegisterMediaPropertiesListener === 'function') {
    const M = window.wallpaperMediaIntegration || {}
    const PLAYING = M.PLAYBACK_PLAYING ?? 1
    const PAUSED = M.PLAYBACK_PAUSED ?? 2
    window.wallpaperRegisterMediaStatusListener && window.wallpaperRegisterMediaStatusListener(e => {
      // 集成被关掉：媒体集成报的都作废
      if (!e.enabled) {
        mediaSeen = false
        mediaCover = { key: '', url: '' }
        mediaSong = { title: '', artist: '', state: 'none' }
        // 当前显示的正是媒体集成报的歌：跟着清掉
        if (!playerLive && music.title) {
          playVer++
          music.title = ''
          music.artist = ''
          music.state = 'none'
          renderMusic()
        }
      }
    })
    window.wallpaperRegisterMediaPropertiesListener(e => {
      mediaSeen = !!e.title
      mediaSong.title = e.title || ''
      mediaSong.artist = e.artist || e.albumArtist || ''
      if (playerLive) return
      playVer++
      music.title = mediaSong.title
      music.artist = mediaSong.artist
      music.source = 'media'
      renderMusic()
    })
    window.wallpaperRegisterMediaThumbnailListener && window.wallpaperRegisterMediaThumbnailListener(e => {
      // 封面记在媒体集成自己报的歌名下：它和桥接服务可能在说不同的播放器
      mediaCover = { key: JSON.stringify([mediaSong.title, mediaSong.artist]), url: typeof e.thumbnail === 'string' ? e.thumbnail : '' }
      renderMusic()
    })
    window.wallpaperRegisterMediaPlaybackListener && window.wallpaperRegisterMediaPlaybackListener(e => {
      mediaSong.state = e.state === PLAYING ? 'playing' : e.state === PAUSED ? 'paused' : 'none'
      if (playerLive) return
      playVer++
      music.state = mediaSong.state
      if (music.state === 'none') music.title = ''
      renderMusic()
    })
  }

  // 备用路唯一入口：先撤掉已排好的，再排一次
  function refreshMusic(delay) {
    clearTimeout(musicTimer)
    musicTimer = 0
    if (isPaused || isDemo) return
    musicTimer = setTimeout(pollMusic, delay)
  }
  function cancelMusic() {
    clearTimeout(musicTimer)
    musicTimer = 0
    if (musicCtl) {
      musicCtl.abort()
      musicCtl = null
    }
  }
  async function pollMusic() {
    musicTimer = 0
    if (isPaused || isDemo || musicCtl) return
    const ctl = new AbortController()
    musicCtl = ctl
    const t = setTimeout(() => ctl.abort(), 2500)
    let data = null
    try {
      const res = await fetch(BRIDGE + '/music', { cache: 'no-store', signal: ctl.signal })
      if (res.ok) data = await res.json()
    } catch (err) {}
    clearTimeout(t)
    // 期间被取消（暂停）：这条结果作废
    if (musicCtl !== ctl) return
    musicCtl = null
    if (isPaused) return
    if (data) {
      musicFails = 0
      applyPlayer(data)
    } else if (++musicFails >= 3 && playerLive) releasePlayer() // 桥接服务连不上了：交给媒体集成
    refreshMusic(1000)
  }
  // 桥接服务这边没有歌：交回给媒体集成（它可能在报别的播放器）
  function releasePlayer() {
    playerLive = false
    precise = false
    playerDur = 0
    playVer++
    const useMedia = mediaSeen && mediaSong.state !== 'none'
    music.title = useMedia ? mediaSong.title : ''
    music.artist = useMedia ? mediaSong.artist : ''
    music.state = useMedia ? mediaSong.state : 'none'
    music.app = ''
    music.source = 'media'
    renderMusic()
  }
  function applyPlayer(data) {
    const title = typeof data.title === 'string' ? data.title : ''
    // 播放器停了（会话还留着歌名）和没有歌是一回事
    if (!title || data.state === 'none') {
      if (playerLive) releasePlayer()
      return
    }
    playerLive = true
    const artist = typeof data.artist === 'string' ? data.artist : ''
    // 播放 / 暂停：桥接服务读的系统媒体状态；读不到才按「有歌名就算在放」
    const state = data.state === 'paused' ? 'paused' : 'playing'
    const hasPos = typeof data.pos === 'number' && typeof data.dur === 'number' && data.dur > 0
    precise = hasPos
    playerDur = hasPos ? data.dur : 0
    const app = typeof data.app === 'string' ? data.app : ''
    // 同名的歌换了播放器：歌词来源和时间线都不一样了，当作新的一首重新对齐
    const appChanged = !!music.app && app !== music.app
    if (appChanged) lastSongKey = ''
    music.app = app
    if (appChanged || title !== music.title || artist !== music.artist || state !== music.state) {
      playVer++
      music.title = title
      music.artist = artist
      music.state = state
      music.source = 'smtc'
      renderMusic()
    }
    if (hasPos) alignToPlayer(data.pos, data.dur)
    sendClock()
  }
  // 播放器报了进度：以它为准。差得不多就不动，免得歌词和进度条一跳一跳
  function alignToPlayer(pos, dur) {
    const now = Date.now()
    const wantPaused = music.state !== 'playing'
    const drift = Math.abs(pos - lyricPos())
    if (now < seekGuard.until && drift > 1500) return
    const stale = !lyric.synced || drift > 500 || !!lyric.pausedAt !== wantPaused
    const durChanged = dur !== lyric.duration
    if (durChanged) {
      lyric.duration = dur
      progKey = ''
    }
    if (stale) {
      lyric.startAt = now - pos
      lyric.pausedAt = wantPaused ? now : 0
      lyric.synced = true
      lyric.idx = -2
      lyric.rev++
      progKey = ''
      tickLyric()
    } else if (durChanged) showProgress()
  }
  function sendClock() {
    // lyric.shift：Folia 的歌词偏移和试听片段起点，歌词时间 = 播放进度 + shift
    // 没赶上开头时也照常走（从第一次看到这首歌算起）：歌词可能不同步，但总比整首没有好，可以用 ±5 秒调
    // 可以是负数（歌词延后、往回微调）：那时歌词还没开始，舞台照常往前走
    Stage.clock(lyricPos() + lyric.shift, !lyric.pausedAt && music.state === 'playing' && !isPaused)
  }
  refreshMusic(300)

  // ---- 歌词 ----
  // Folia 报精确进度，直接用（见 alignToPlayer）。
  // 网易云不报播放进度，只能计时：桥接服务常驻后台记下每首歌开始的时间（壁纸重新加载也不会丢），
  // 壁纸把看到的换歌、暂停、继续、手动对齐告诉它。拖动进度条后点「对齐」即可重新对齐。

  const lyric = { shift: 0, key: '', seq: 0, rev: 0, retries: 0, lines: [], duration: 0, startAt: 0, pausedAt: 0, synced: false, loaded: false, timer: 0, idx: -2, ctl: null }
  const lyricCache = new Map()
  let singLine = ''
  const CREDIT = /^(作词|作曲|编曲|制作|制作人|混音|和声|吉他|贝斯|鼓|录音|母带|出品|监制|策划|词|曲|Lyrics|Composer|Arranger)\s*[:：]/i

  function parseLrc(text) {
    const out = []
    for (const raw of String(text || '').split('\n')) {
      const tags = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)]
      const words = raw.replace(/\[[^\]]*\]/g, '').trim()
      if (!tags.length || !words) continue
      for (const t of tags) out.push({ t: (Number(t[1]) * 60 + Number(t[2])) * 1000, text: words })
    }
    return out.sort((a, b) => a.t - b.t)
  }

  // 和桥接服务一致的键：歌名、歌手之间用控制字符隔开，不会撞车
  const clean = v => String(v).replace(/[\u0000-\u001f]/g, '').trim().toLowerCase()
  const normKey = (t, a) => clean(t) + '\u0001' + clean(a)
  const lyricKey = () => JSON.stringify([music.title, music.artist])
  // 告诉桥接服务：换歌 / 暂停 / 继续 / 手动对齐 / 停止。排成队一条条发，不会先后乱序
  let trackQueue = Promise.resolve()
  let lastPlayed = { title: '', artist: '' }
  function postTrack(ev, extra, title, artist) {
    title = title || music.title
    artist = title === music.title ? music.artist : artist || ''
    if (!title || isDemo || precise) return
    const body = ev + '\n' + title + '\n' + artist + (extra ? '\n' + extra : '')
    trackQueue = trackQueue.then(() => fetch(BRIDGE + '/track', { method: 'POST', body }).catch(() => {}))
  }
  // 问桥接服务这首歌是什么时候开始放的
  let trackCtl = null
  async function syncTrack() {
    if (isDemo || !music.title || precise) return
    if (trackCtl) trackCtl.abort()
    const ctl = new AbortController()
    trackCtl = ctl
    // 记下发起时的歌曲序号和本地改动版本：回来时变了（期间点了对齐、暂停、换歌）就作废
    const seq = lyric.seq
    const rev = lyric.rev
    await trackQueue
    if (trackCtl !== ctl) return
    const t = setTimeout(() => ctl.abort(), 2500)
    let data = null
    try {
      const res = await fetch(BRIDGE + '/track', { cache: 'no-store', signal: ctl.signal })
      if (res.ok) data = await res.json()
    } catch (err) {}
    clearTimeout(t)
    if (trackCtl !== ctl) return
    trackCtl = null
    if (seq !== lyric.seq || rev !== lyric.rev) return
    if (!data || data.key !== normKey(music.title, music.artist) || lyric.key !== lyricKey()) return
    if (typeof data.startAt !== 'number' || !isFinite(data.startAt)) return
    lyric.startAt = data.startAt
    lyric.pausedAt = typeof data.pausedAt === 'number' && data.pausedAt > 0 ? data.pausedAt : 0
    lyric.synced = data.synced === true
    lyric.idx = -2
    progKey = ''
    tickLyric()
  }

  function onSongChange(isFirst) {
    clearTimeout(lyric.timer)
    lyric.key = lyricKey()
    lyric.seq++
    lyric.rev++
    lyric.retries = 0
    lastPlayed = { title: music.title, artist: music.artist }
    lyric.lines = []
    lyric.duration = precise ? playerDur : 0
    lyric.shift = 0
    lyric.loaded = false
    lyric.idx = -2
    Stage.song({ key: lyric.key, title: music.title, artist: music.artist })
    // 刚看到这首歌出现：现在就是第 0 秒；如果是暂停着切过来的，先停表，等放起来再走。
    // 壁纸刚打开时看到的那首不知道放到哪了，问桥接服务
    lyric.synced = !isFirst
    lyric.startAt = Date.now()
    lyric.pausedAt = music.state === 'playing' ? 0 : Date.now()
    singLine = ''
    progKey = ''
    showLyric()
    loadLyric(lyric.key, lyric.seq)
    if (lyric.synced) postTrack('start', lyric.pausedAt ? 'paused' : '')
    syncTrack()
  }

  function onPlayState(now) {
    lyric.rev++
    if (now === 'paused') postTrack('pause')
    if (now === 'playing') postTrack('resume')
    if (now === 'paused' && !lyric.pausedAt) lyric.pausedAt = Date.now()
    if (now === 'playing' && lyric.pausedAt) {
      lyric.startAt += Date.now() - lyric.pausedAt
      lyric.pausedAt = 0
    }
    tickLyric()
  }

  async function loadLyric(key, seq) {
    if (isDemo) return
    // Folia 放的歌不用缓存：它的歌词接口可能后来才开，歌词和偏移也可能被改过
    const isFolia = /folia/i.test(music.app || '')
    if (!isFolia && lyricCache.has(key)) return applyLyric(key, seq, lyricCache.get(key))
    if (lyric.ctl) lyric.ctl.abort()
    const ctl = new AbortController()
    lyric.ctl = ctl
    // 排队 3 秒 + 网易云 8 秒 + QQ、酷狗各 3.5 秒 + Folia 0.4 秒，都慢时最多约 19 秒
    const t = setTimeout(() => ctl.abort(), 22000)
    let data = null
    try {
      const q = '?title=' + encodeURIComponent(music.title) + '&artist=' + encodeURIComponent(music.artist)
      const res = await fetch(BRIDGE + '/lyric' + q, { cache: 'no-store', signal: ctl.signal })
      if (res.ok) data = await res.json()
    } catch (err) {}
    clearTimeout(t)
    // 被下一首取消了：直接作废，不要把「没找到」写到后来的歌上
    if (lyric.ctl !== ctl) return
    lyric.ctl = null
    if (!data || data.error) {
      if (seq === lyric.seq && lyric.retries < 3) {
        lyric.retries++
        setTimeout(() => {
          if (seq === lyric.seq && !lyric.loaded) loadLyric(key, seq)
        }, 5000 * lyric.retries)
        return
      }
      return applyLyric(key, seq, null)
    }
    // 查不到的不记：下次放到再试
    if (data.found && !isFolia) {
      lyricCache.set(key, data)
      if (lyricCache.size > 10) lyricCache.delete(lyricCache.keys().next().value)
    }
    applyLyric(key, seq, data)
  }

  function applyLyric(key, seq, data) {
    if (key !== lyric.key || seq !== lyric.seq) return
    if (data && typeof data.cover === 'string' && /^http:\/\/127\.0\.0\.1:47321\/cover\/[0-9]+\.jpg$/.test(data.cover)) {
      lyricCover = { key: songKeyNow(), url: data.cover }
      renderMusic()
    }
    const foliaLines = data && data.found && Array.isArray(data.lines) ? data.lines : null
    lyric.shift = 0
    if (foliaLines) {
      // Folia 歌词接口给的：单位是秒。歌词时间 = 进度 + 片段起点 - 偏移（正值表示歌词延后）
      const num = v => (typeof v === 'number' && isFinite(v) ? v : 0)
      lyric.shift = num(data.clipStartMs) - num(data.offset)
      lyric.lines = foliaLines
        .filter(x => x && typeof x.text === 'string' && typeof x.startTime === 'number')
        .map(x => ({ t: x.startTime * 1000 - lyric.shift, text: x.text, tr: typeof x.translation === 'string' ? x.translation : '' }))
    } else {
      const lines = data && data.found ? parseLrc(data.lrc) : []
      const tr = data && data.found ? parseLrc(data.tlyric) : []
      const trAt = new Map(tr.map(x => [Math.round(x.t / 100), x.text]))
      lyric.lines = lines.map(x => ({ t: x.t, text: x.text, tr: trAt.get(Math.round(x.t / 100)) || '' }))
    }
    if (!precise || !lyric.duration) lyric.duration = data && typeof data.duration === 'number' ? data.duration : 0
    Stage.song({
      key: lyric.key, title: music.title, artist: music.artist, duration: lyric.duration,
      lrc: data && data.found ? data.lrc : '', yrc: data && data.found ? data.yrc : '', tlyric: data && data.found ? data.tlyric : '',
      lines: foliaLines,
    })
    lyric.loaded = true
    lyric.idx = -2
    progKey = ''
    tickLyric()
  }

  const lyricPos = () => (lyric.pausedAt || Date.now()) - lyric.startAt

  // 只在换行的那一刻更新一次，不按固定频率刷新
  function tickLyric() {
    clearTimeout(lyric.timer)
    lyric.timer = 0
    sendClock()
    if (isPaused) return
    showLyric()
    if (!lyric.synced || lyric.pausedAt || !lyric.lines.length || music.state !== 'playing') return
    const p = lyricPos()
    const next = lyric.lines.find(x => x.t > p)
    if (next) lyric.timer = setTimeout(tickLyric, Math.min(next.t - p + 30, 60000))
  }

  function showLyric() {
    let cur = ''
    let tr = ''
    let isTip = true
    let sing = ''
    if (!music.title) {
      cur = ''
    } else if (!lyric.loaded) {
      cur = '正在找歌词…'
    } else if (!lyric.lines.length) {
      cur = '没找到这首歌的歌词（可能是纯音乐）'
    } else if (!lyric.synced) {
      cur = '没赶上这首的开头，歌词可能不同步：拖一下进度条就能对齐，下一首会自动同步'
    } else {
      const p = lyricPos()
      let idx = -1
      for (let n = 0; n < lyric.lines.length && lyric.lines[n].t <= p; n++) idx = n
      const line = idx >= 0 ? lyric.lines[idx] : null
      cur = line ? line.text : '♪'
      tr = line ? line.tr : ''
      isTip = false
      sing = line && !CREDIT.test(line.text) ? line.text : ''
    }
    $('lyric').classList.toggle('is-tip', isTip && !!cur)
    setText('lyricCur', cur)
    setText('lyricTr', tr)
    if (sing !== singLine) {
      singLine = sing
      renderPetBubble()
    }
    showProgress()
  }

  // 时间戳：已播放 / 总时长。只有在放、而且对上了开头时才每秒走一次字，其余时候不刷新
  let clockTimerMusic = 0
  const fmt = ms => {
    const sec = Math.max(0, Math.floor(ms / 1000))
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0')
  }
  function stopClock() {
    clearTimeout(clockTimerMusic)
    clockTimerMusic = 0
  }
  function showClock() {
    stopClock()
    if (seekDrag !== null) return
    const box = $('mtime')
    const hasDur = lyric.duration > 0 && !!music.title
    box.hidden = !music.title
    if (box.hidden) {
      setText('mdur', '')
      return
    }
    setText('mdur', hasDur ? fmt(lyric.duration) : '--:--')
    const p = lyricPos()
    setText('mpos', fmt(hasDur ? Math.min(p, lyric.duration) : p))
    const running = music.state === 'playing' && !lyric.pausedAt && !isPaused && !(hasDur && p >= lyric.duration)
    // 对齐到下一个整秒再走
    if (running) clockTimerMusic = setTimeout(showClock, 1000 - (p % 1000) + 20)
  }

  // 估算的进度条：一次设好剩下的时长，交给 CSS 过渡自己跑
  let progKey = ''
  function showProgress() {
    showClock()
    const bar = $('mprog')
    const fill = $('mprogFill')
    const ok = lyric.duration > 0 && !!music.title
    bar.hidden = !ok
    if (!ok || seekDrag !== null) return
    const p = Math.max(0, Math.min(lyric.duration, lyricPos()))
    const running = music.state === 'playing' && !lyric.pausedAt && !isPaused
    const key = Math.round(lyric.startAt) + '|' + running + '|' + lyric.duration
    if (key === progKey) return
    progKey = key
    fill.style.transition = 'none'
    fill.style.transform = 'scaleX(' + p / lyric.duration + ')'
    if (running) {
      void fill.offsetWidth
      fill.style.transition = 'transform ' + Math.round(lyric.duration - p) + 'ms linear'
      fill.style.transform = 'scaleX(1)'
    }
  }

  // 只更新气泡（歌词换行、跳舞开始或停下时用，不用整页重画）
  function renderPetBubble() {
    if (Date.now() < localUntil || (mainSession() && isSessionPose()) || isAsleep) return
    setSay(singLine && dancingNow ? '♪ ' + singLine : '')
  }

  // 拖进度条。Folia 这类支持跳转的播放器真的跳过去；网易云不让外部改进度，歌曲本身不动，只把歌词和进度条对到这个位置
  let seekDrag = null
  // 刚拖完：桥接服务手里可能还是拖之前的进度，这段时间内差得多的采样不算数
  const seekGuard = { id: 0, until: 0 }
  const seekRatio = ev => {
    const r = $('mprog').getBoundingClientRect()
    return Math.max(0, Math.min(1, (ev.clientX - r.left) / (r.width || 1)))
  }
  function showSeek(ratio) {
    const fill = $('mprogFill')
    fill.style.transition = 'none'
    fill.style.transform = 'scaleX(' + ratio + ')'
    setText('mpos', fmt(ratio * lyric.duration))
  }
  function seekTo(ms) {
    const now = Date.now()
    lyric.startAt = now - ms
    if (lyric.pausedAt) lyric.pausedAt = now
    lyric.synced = true
    lyric.idx = -2
    lyric.rev++
    progKey = ''
    if (precise) {
      const guard = ++seekGuard.id
      seekGuard.until = now + 2500
      const clear = () => { if (seekGuard.id === guard) seekGuard.until = 0 }
      fetch(BRIDGE + '/seek', { method: 'POST', body: Math.round(ms) + '\n' + music.title })
        .then(res => res.json())
        .then(d => { if (!d || d.ok !== true) clear() })
        .catch(clear)
    } else postTrack('seek', String(Math.round(ms)))
    tickLyric()
  }
  $('mprog').addEventListener('mousedown', ev => {
    if (!(lyric.duration > 0) || !music.title) return
    ev.preventDefault()
    ev.stopPropagation()
    noteActivity()
    seekDrag = seekRatio(ev)
    $('mprog').classList.add('is-drag')
    showSeek(seekDrag)
  })
  document.addEventListener('mousemove', ev => {
    if (seekDrag === null) return
    seekDrag = seekRatio(ev)
    showSeek(seekDrag)
  })
  document.addEventListener('mouseup', () => {
    if (seekDrag === null) return
    const ratio = seekDrag
    seekDrag = null
    $('mprog').classList.remove('is-drag')
    seekTo(ratio * lyric.duration)
  })

  // ---- 小 Claude 的作息：上班去电脑前，困了回小屋，其余时间出来逛 ----

  let atDesk = false
  let insideHome = false
  const homeOn = () => opts.home && Home.ok && !!Home.spots.door

  // 坐上 / 离开电竞椅：椅背那一层只在坐着时盖在小 Claude 前面
  function setAtDesk(v) {
    if (atDesk === v) return
    atDesk = v
    document.body.classList.toggle('at-desk', v)
    if (!v) Home.set({ working: false, screen: 'off|off' })
    // 姿势跟着变（坐下 / 站起来），不等下一次会话数据
    safeRender()
  }

  // 一段互动里套着的定时器（追逐、扑球、哈气后逃跑……）：都登记在这里，暂停、拖动、关小岛、进屋时一起作废
  let actId = 0
  let actTimers = []
  function later(fn, ms) {
    const id = actId
    const t = setTimeout(() => {
      actTimers = actTimers.filter(x => x !== t)
      if (id === actId && !isPaused) fn()
    }, ms)
    actTimers.push(t)
  }
  function cancelActs() {
    actId++
    actTimers.forEach(clearTimeout)
    actTimers = []
    // 每只猫：定时器里本来要做的复原直接做掉，走到半路的玩法作废
    finishBallDrag(true)
    kitties.forEach(K => K.onCancel())
    // 激光笔玩到一半被打断：收起激光笔和红点
    laserDot.hidden = true
    Pet3D.set({ holding: null })
    held.toy = null
    held.ball = null
    Home.set({ toy: 0 })
    // 正在和小 Claude 一起玩的那只猫：一起停下
    if (duoCat) {
      duoCat.visitId++
      duoCat.halt()
      duoCat = null
      if (visiting && ['petcat', 'chase', 'ball', 'laser'].includes(visiting.kind)) cancelVisit()
    }
  }

  // 小 Claude 脚底在页面上的位置，以及「让脚踩到某个页面点」需要的 buddy 位置
  function clawdFeet() {
    const c = $('pet').getBoundingClientRect()
    return { x: c.left + c.width * 0.5, y: c.top + c.height * 0.78 }
  }
  function clawdFeetTo(pt) {
    const f = field.getBoundingClientRect()
    const p = petBox()
    return { x: pt.x - f.left - p.x - p.w * 0.5, y: pt.y - f.top - p.y - p.h * 0.78 }
  }

  // 走到页面上的某个点（和 visit 一样可取消），到了站 stay 毫秒
  function visitPoint(kind, pt, onArrive, stay, opt) {
    const hold = stay || 6000
    const id = ++visitId
    setVisiting({ kind })
    walkTo(clawdFeetTo(pt), {
      fast: !!(opt && opt.fast),
      fastIfFar: true,
      onArrive: () => {
        if (id !== visitId) return
        // 到了才发现不用做了（比如活已经干完）：不停留，马上安排下一步
        if (onArrive && onArrive(id) === false) {
          setVisiting(null)
          restUntil = 0
          scheduleWander(1200)
          return
        }
        restUntil = Date.now() + hold
        scheduleWander(hold)
      },
    })
    return id
  }

  const shouldWork = () => homeOn() && opts.roam && (mainPhase === 'working' || mainPhase === 'thinking')
  // 上班：走到电脑前，背对着你敲键盘
  function goToDesk() {
    if (atDesk || (visiting && visiting.kind === 'desk')) return
    visitPoint('desk', Home.spots.seat, () => {
      if (!homeOn() || !shouldWork()) return false
      Pet3D.play('hop')
      setAtDesk(true)
      safeRender()
    }, 600000, { fast: true })
  }
  // 活干完了：从椅子上下来，去别处逛
  function leaveDesk() {
    if (visiting && visiting.kind === 'desk') cancelVisit()
    if (!atDesk) return
    restUntil = 0
    setTimeout(() => {
      if (!atDesk || shouldWork() || drag || isPaused) return
      cancelVisit()
      walkTo(randomSpot())
      scheduleWander()
    }, 1200)
  }

  // 困了：走回小屋，进门，窗户亮灯冒 Zzz；屋里时不渲染小 Claude
  function goHomeToSleep() {
    if (!homeOn() || !opts.roam || insideHome) return
    visitPoint('home', Home.spots.door, () => {
      if (isAsleep && homeOn()) enterHome()
    }, 3600000)
  }
  function enterHome() {
    cancelActs()
    insideHome = true
    buddy.classList.add('inside')
    Pet3D.hide(true)
    Home.set({ inside: true })
    $('homeZz').hidden = false
    updateNapBtn()
  }
  function exitHome() {
    if (!insideHome) return
    insideHome = false
    buddy.classList.remove('inside')
    Pet3D.hide(false)
    Home.set({ inside: false })
    $('homeZz').hidden = true
    updateNapBtn()
    restUntil = 0
    // 猫也醒过来
    kitties.forEach(K => {
      if (!K.sleeping || Math.random() >= 0.7) return
      const v = K.planV
      setTimeout(() => { if (K.planV === v && K.sleeping && !isPaused) K.wake() }, rand(1500, 4000))
    })
  }

  // ---- 回屋小憩：闲着时隔一阵自己回屋睡一会儿（夜里更勤），也可以点门口花盆旁的按钮叫它回去 ----
  // 小憩时动鼠标不会吵醒它；Claude 一开始干活就马上出门去工位；再点一下按钮就叫醒

  let napping = false
  let napTimer = 0
  let lastNapAt = Date.now()
  const homeBtn = $('homeBtn')
  function updateNapBtn() {
    homeBtn.textContent = insideHome ? '☀ 叫醒' : '☾ 回家睡觉'
    homeBtn.classList.toggle('is-inside', insideHome)
    if (!$('pmPanel').hidden) updateMenu()
  }
  // Claude 在干活（不管溜达开关开没开）
  const isWorkingNow = () => mainPhase === 'working' || mainPhase === 'thinking'
  function goHomeNap(ms, byUser) {
    if (!homeOn() || insideHome) return false
    if (isWorkingNow()) {
      if (byUser) say('还在干活呢，忙完再睡～', 2200)
      return false
    }
    lastNapAt = Date.now()
    setAtDesk(false)
    say(byUser ? '好，回去睡一会儿～' : pick(['有点困，回屋眯一会儿', '我去打个盹～', '午睡时间到']), 2200)
    // 1：回家路上别被原来排好的溜达叫走
    clearTimeout(walkTimer)
    visitPoint('nap', Home.spots.door, () => {
      if (!homeOn() || isWorkingNow()) return false
      napping = true
      enterHome()
      clearTimeout(napTimer)
      napTimer = setTimeout(endNap, ms)
    }, ms + 2000, { fast: byUser })
    return true
  }
  function endNap() {
    clearTimeout(napTimer)
    napTimer = 0
    if (!napping) return
    napping = false
    lastNapAt = Date.now()
    if (insideHome && !isAsleep) {
      exitHome()
      Pet3D.play('stretch')
      say(pick(['睡饱啦！', '伸个懒腰～', '精神满满！']), 2200)
    }
    if (visiting && visiting.kind === 'nap') cancelVisit()
    restUntil = 0
    scheduleWander(2000)
  }
  homeBtn.addEventListener('click', ev => {
    ev.stopPropagation()
    if (isPaused) return
    if (insideHome) {
      if (isAsleep) wake()
      else endNap()
      return
    }
    // 已经在回家路上：不用再走一遍
    if (visiting && (visiting.kind === 'nap' || visiting.kind === 'home')) return
    goHomeNap(5 * 60000, true)
  })

  // ---- 猫咪们的日常 ----
  // 每只猫一份：位置、走路、气泡、自己的念头、和你的互动都各管各的。
  // 毛线球、和小 Claude 一起玩、两只猫一起玩，在后面统一安排。

  const kitties = []
  // 猫爬架上的玩具、毛线球：同一时间只给一只猫玩；这只猫一换计划（被叫走、被拖、被取消）就让出来
  const held = { toy: null, ball: null }
  function releaseHeld(K) {
    if (held.toy === K) {
      held.toy = null
      Home.set({ toy: 0 })
    }
    if (held.ball === K) held.ball = null
  }

  // cfg：3D 模型、页面元素、名字、性格（各种日常的权重）、台词
  function makeKitty(cfg) {
    const C = cfg.cat
    const root = $(cfg.root)
    const wrap = $(cfg.wrap)
    const hit = $(cfg.hit)
    const canvas = $(cfg.canvas)
    const bubbleBox = $(cfg.bubble)
    const sayNode = $(cfg.say)
    const K = {
      C, name: cfg.name, lines: cfg.lines,
      pos: { x: 0, y: 0 }, walking: false, sleeping: false, playing: false, drag: null,
      busyUntil: 0, visitId: 0, napAt: '', pair: null,
      // planV：当前计划的编号。queued：松手后排队等着接力扑球。lureV / lureT：被第几次拖球吸引、那次的计划编号
      planV: 0, queued: false, lureV: -1, lureT: -1, abortHook: null,
    }
    let arriveTimer = 0
    let thinkTimer = 0
    let rect = null
    let sayTimer = 0
    const on = () => homeOn() && C.ok
    K.on = on

    const box = () => ({ x: wrap.offsetLeft, y: wrap.offsetTop, w: wrap.offsetWidth, h: wrap.offsetHeight })
    K.box = box
    function kClamp(x, y) {
      const b = box()
      const minX = -b.x - b.w * 0.2
      const maxX = field.clientWidth - b.x - b.w * 0.8
